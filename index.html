<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YDS Sözlüğü</title><meta name="theme-color" content="#0e5a78"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YDS Sözlüğü"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one thumb-reachable column. Sticky search on top, scrolling log below, fixed four-tab bar at the bottom; study mode is a full-screen card with answers at thumb height. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#14232d; --muted:#5b6b75; --line:#d5dde2;
  --accent:#0e5a78; --brass:#a3762b; --hl:#fbe9c4; --ok:#2f7a4f; --warn:#b2452c; --soft:#e3ebef;
  --display:"Spectral",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#14222b; --fg:#e4ecf0; --muted:#93a5b0; --line:#25363f;
  --accent:#5fb3d6; --brass:#d7aa5c; --hl:#4a3a17; --ok:#6cc391; --warn:#ec8a6c; --soft:#1a2b35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#14222b; --fg:#e4ecf0; --muted:#93a5b0; --line:#25363f;
  --accent:#5fb3d6; --brass:#d7aa5c; --hl:#4a3a17; --ok:#6cc391; --warn:#ec8a6c; --soft:#1a2b35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{margin:0;font:700 21px/1.1 var(--display)}
.sync{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.search{position:relative}
#q{width:100%;font:16px var(--body);padding:11px 38px 11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
#qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;color:var(--muted);font-size:20px;cursor:pointer}
main{padding-block:12px calc(env(safe-area-inset-bottom,0px) + 32px)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 14px var(--body);color:var(--muted);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip.w{font-weight:600;color:var(--fg);padding:5px 11px;min-height:32px}
.chip.w.tz{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.chip.w.ok{color:var(--ok);border-color:var(--ok)}
.seg{display:flex;gap:4px;margin-top:8px}
.seg button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:7px 4px;font:600 13px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.lead{color:var(--muted);margin:12px 0 4px;font-size:15px;max-width:62ch}
.lead b{color:var(--fg)}
.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h2{margin:0;font:700 18px var(--display)}
.sec .m{color:var(--brass);font-weight:600;font-size:14px}
.sec .c{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.list{display:grid;gap:6px;margin-top:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer;min-height:52px}
.row:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;border-radius:10px}
.rw{font:700 18px/1.2 var(--display);min-width:0;overflow-wrap:anywhere}
.rt{grid-column:1;color:var(--muted);font-size:14px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:center}
.tz{font:500 11px var(--mono);color:var(--brass)}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.done{color:var(--ok);font-weight:700}
.det{padding:0 14px 14px;display:grid;gap:10px;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bd{font:500 12px var(--mono);border-radius:5px;padding:2px 7px;background:var(--soft);color:var(--accent)}
.bd.y{color:var(--brass)}
.ex{margin:0;padding-left:12px;border-left:2px solid var(--line);font:italic 500 16px/1.5 var(--display)}
.ex.own{border-left-style:dashed}
.extr{margin:-4px 0 0 14px;font-size:14px;color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px;font-style:normal;font-weight:700}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.fix{font-size:14px;color:var(--warn);border-left:2px solid var(--warn);padding-left:8px}
.morph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;font:500 14px var(--mono)}
.morph i{font-style:normal;color:var(--muted)}
.mp{color:var(--accent);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.mg{font:13px var(--body);color:var(--muted);margin-left:4px}
.link{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:14px;padding:7px 10px;border-radius:8px;background:var(--bg)}
.link b{font:700 16px var(--display);color:var(--ok)}
.link.t-yalanci b{color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:9px;padding:9px 14px;font:600 15px var(--body);cursor:pointer;min-height:42px}
.btn.fill{background:var(--accent);color:var(--bg)}
.btn.okb{border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:default}
.more{width:100%;margin-top:10px}
.empty{color:var(--muted);padding:20px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;margin-top:12px}
.panel h2{margin:0;font:700 19px var(--display)}
.panel p{margin:0}
.fnr{display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.fnl b{font:500 14px var(--mono);color:var(--accent);margin-right:8px}
.fnl span{font-size:14px;color:var(--muted)}
.tken{margin:0;font:500 18px/1.5 var(--display)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;min-height:32px;display:flex;align-items:center}
.pairs{display:grid;gap:6px}
.pair{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.pair .pw{font:700 17px var(--display)}
.pair .pt{font-weight:700;color:var(--ok);justify-self:end}
.pair.t-yalanci .pt{color:var(--warn)}
.pair .pn{grid-column:1/3;font-size:14px;color:var(--muted)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;padding-top:6px}
.bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bar.today{background:var(--brass)}
.bx{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font:500 10px var(--mono);color:var(--muted);text-align:center}
.prog{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.pr .tr2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pr .tr2 i{display:block;height:100%;background:var(--ok)}
.pr span:last-child{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:2px;font:600 12px var(--body);color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{font:600 10px var(--mono);background:var(--brass);color:var(--surface);border-radius:999px;padding:0 5px;margin-left:2px}
/* study */
.study{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sh .x{border:0;background:none;font-size:26px;width:40px;height:40px;cursor:pointer;color:var(--muted)}
.pbar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sn{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sbody{overflow:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 16px;display:grid;align-content:center}
.scard{max-width:620px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:grid;gap:12px}
.scard .big{font:700 clamp(30px,9vw,44px)/1.1 var(--display);text-align:center;overflow-wrap:anywhere}
.scard .hint{text-align:center;color:var(--muted)}
.scard .ans{text-align:center;font:600 20px var(--body);color:var(--brass)}
.sfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;max-width:720px;width:100%;margin:0 auto}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.answers button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 16px var(--body);cursor:pointer;display:grid;line-height:1.15}
.answers button small{font:500 11px var(--mono);color:var(--muted)}
.answers .a0{color:var(--warn);border-color:var(--warn)}
.answers .a1{color:var(--brass);border-color:var(--brass)}
.answers .a2{color:var(--ok);border-color:var(--ok)}
.reveal{min-height:58px;border-radius:12px;font-size:17px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.45);display:grid;align-items:end}
.sheet .in{background:var(--bg);border-radius:16px 16px 0 0;max-height:86vh;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;width:100%;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:reduce){.pbar i{transition:none}}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}

/* levels and heat */
.meters{all:unset;box-sizing:border-box;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-bottom:10px;cursor:pointer}
.meters:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.mt{display:grid;gap:3px;min-width:0}
.ml{font:600 11px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.mb i{display:block;height:100%;background:var(--ok)}
.lvd{display:inline-flex;gap:2px}
.lvd i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.lvd i.on{background:var(--brass)}
.lvc{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.lvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvh b{font:700 17px var(--display)}
.lvn{margin-left:auto;font-size:13px;color:var(--brass);font-weight:600}
.lvbar{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.lvbar i.k{background:var(--ok)}
.lvbar i.r{background:var(--warn)}
.lvbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.lvm{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.item.h1{background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.item.h2{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.item.h3{background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-color:var(--warn)}
.item.h2 .rw,.item.h3 .rw{color:var(--warn)}
.item.lrn{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.w.h1{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.w.h2{border-color:var(--warn);color:var(--warn)}
.chip.w.h3{border-color:var(--warn);background:var(--warn);color:var(--surface)}
.btn.nob{border-color:var(--warn);color:var(--warn)}

/* top tabs (in-flow; no fixed overlays) */
.tabs4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs4 .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:9px;font:600 12px var(--body);color:var(--muted);cursor:pointer;min-height:48px;justify-content:center}
.tabs4 .tab svg{width:21px;height:21px}
.tabs4 .tab[aria-current="page"]{background:var(--accent);color:var(--bg)}
.tabs4 .tab[aria-current="page"] .badge{background:var(--bg);color:var(--accent)}
.inl{position:relative;border-color:var(--accent)}
.inl .x{position:absolute;right:6px;top:6px;border:0;background:none;font-size:24px;width:40px;height:40px;color:var(--muted);cursor:pointer}
.studyv{display:grid;gap:12px}
.studyv .sh{padding:0}
.studyv .sfoot{padding:0}
.sync.flash{color:var(--ok);font-weight:600}
.mv{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mp2{font:500 10px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.kg{gap:8px;padding:12px}
.kgh{margin:0;font:700 17px var(--display)}
.kgh .c{font:500 12px var(--mono);color:var(--muted)}
.item.wrn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.sp{color:var(--brass);font-weight:400;margin:0 1px}
.parts{display:grid;gap:4px}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pc{display:grid;justify-items:center;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--bg)}
.pc b{font:700 16px var(--display)}
.pc small{font-size:12px;color:var(--muted)}
.pplus{color:var(--muted)}
.cd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:-2px 0 10px;padding:7px 12px;border-radius:9px;background:var(--accent);color:var(--bg);font-size:13px}
.cd b{font:700 16px var(--display);font-variant-numeric:tabular-nums}

tüydü. Yine de dalgıçlar geminin isim plakasını kayda aldı.","n":3,"ex":[],"parts":{"p":[["never","asla"],["the",""],["less","daha az"]],"lit":"kelimesi kelimesine: asla daha az değil → yine de"}},{"w":"Nonetheless","tr":"yine de, buna rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Nevertheless","However","Even so"],"pr":2,"ox":"Funding was limited; [[nonetheless]], the project produced a detailed site map.","oxTr":"Fon sınırlıydı; yine de proje ayrıntılı bir alan haritası üretti.","n":0,"ex":[],"parts":{"p":[["none","hiç"],["the",""],["less","daha az"]],"lit":"hiç de daha az değil → yine de, buna rağmen"}},{"w":"Yet","tr":"ama, ne var ki, yine de","g":"Zıtlık","y":"+ cümle","eq":["But"],"pr":2,"ox":"The submarine was lost in 1915, [[yet]] its exact location remained a mystery for decades.","oxTr":"Denizaltı 1915'te kayboldu, ne var ki tam yeri on yıllarca gizem olarak kaldı.","note":"olumsuz cümlede ve cümle sonunda 'henüz' anlamı da var","n":4,"ex":[]},{"w":"But","tr":"ama, fakat","g":"Zıtlık","y":"+ cümle","eq":["Yet"],"pr":2,"ox":"The divers searched all day, [[but]] they found no trace of the anchor.","oxTr":"Dalgıçlar bütün gün aradı, ama çapadan hiçbir iz bulamadılar.","n":26,"ex":[]},{"w":"Still","tr":"yine de, buna rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Even so","All the same"],"pr":2,"ox":"The hull is badly corroded. [[Still]], its shape is clearly visible on sonar images.","oxTr":"Gövde ciddi biçimde paslanmış. Yine de şekli sonar görüntülerinde açıkça seçiliyor.","note":"'hâlâ' anlamıyla karıştırma","n":4,"ex":[]},{"w":"Despite","tr":"-e rağmen","g":"Zıtlık","y":"+ isim / V-ing","eq":["In spite of","Notwithstanding"],"pr":1,"ox":"[[Despite]] the strong currents, the team reached the wreck safely.","oxTr":"Güçlü akıntılara rağmen ekip batığa güvenle ulaştı.","note":"despite + isim, although + cümle; 'despite of' yanlış","n":1,"ex":[]},{"w":"In spite of","tr":"-e rağmen","g":"Zıtlık","y":"+ isim / V-ing","eq":["Despite","Notwithstanding"],"pr":1,"ox":"[[In spite of]] being underwater for a century, the guns remain intact.","oxTr":"Bir asırdır su altında olmasına rağmen toplar sağlam duruyor.","note":"in spite of the fact that + cümle","n":0,"ex":[]},{"w":"Notwithstanding","tr":"-e rağmen (resmi)","g":"Zıtlık","y":"+ isim / V-ing","eq":["Despite","In spite of"],"pr":3,"ox":"[[Notwithstanding]] the legal protections, illegal salvage continued in the strait.","oxTr":"Yasal korumalara rağmen boğazda yasa dışı kurtarma çalışmaları sürdü.","note":"resmi dil; ismin ardından da gelebilir","n":0,"ex":[],"parts":{"p":[["not","değil"],["with","karşı"],["standing","durmak"]],"lit":"karşısında durmamak, engel olmamak → -e rağmen"}},{"w":"On the other hand","tr":"öte yandan, diğer taraftan","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","By contrast"],"pr":1,"ox":"Sonar surveys are fast. [[On the other hand]], they cannot replace direct observation by divers.","oxTr":"Sonar taramaları hızlıdır. Öte yandan dalgıçların doğrudan gözleminin yerini tutamazlar.","note":"çoğu kez 'on the one hand' ile eşleşir","n":1,"ex":[]},{"w":"On the contrary","tr":"aksine, tam tersine","g":"Zıtlık","y":"cümle başı, virgülle","eq":[],"pr":2,"ox":"The wreck is not unimportant. [[On the contrary]], it is a key war grave.","oxTr":"Batık önemsiz değil. Aksine, kilit bir savaş mezarıdır.","note":"önceki ifadeyi reddeder; on the other hand ile karıştırma","n":2,"ex":[]},{"w":"Conversely","tr":"tersine, buna karşılık","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","By contrast"],"pr":2,"ox":"Cold water slows decay; [[conversely]], warm water speeds up corrosion.","oxTr":"Soğuk su çürümeyi yavaşlatır; buna karşılık ılık su paslanmayı hızlandırır.","n":0,"ex":[]},{"w":"In contrast","tr":"buna karşın, aksine","g":"Zıtlık","y":"cümle başı, virgülle","eq":["By contrast","On the other hand","Conversely"],"pr":1,"ox":"The northern site is well documented. [[In contrast]], the southern site has never been surveyed.","oxTr":"Kuzeydeki alan iyi belgelenmiştir. Buna karşın güneydeki alan hiç taranmamıştır.","note":"in contrast to/with + isim = -in aksine","n":0,"ex":[]},{"w":"By contrast","tr":"buna karşın, buna karşılık","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","On the other hand","Conversely"],"pr":2,"ox":"Steel hulls collapse slowly. [[By contrast]], wooden hulls are quickly destroyed by shipworms.","oxTr":"Çelik gövdeler yavaş çöker. Buna karşılık ahşap gövdeler deniz kurtlarınca hızla yok edilir.","n":11,"ex":[]},{"w":"Unlike","tr":"-in aksine, -den farklı olarak","g":"Zıtlık","y":"+ isim / V-ing","eq":[],"pr":2,"ox":"[[Unlike]] the battleship, the minesweeper sank in very shallow water.","oxTr":"Zırhlının aksine mayın tarama gemisi çok sığ suda battı.","note":"unlike + isim; cümle almaz","n":1,"ex":[]},{"w":"Contrary to","tr":"-in aksine, -e ters olarak","g":"Zıtlık","y":"+ isim","eq":[],"pr":2,"ox":"[[Contrary to]] popular belief, the submarine was not sunk by a mine.","oxTr":"Yaygın inancın aksine denizaltı bir mayınla batırılmadı.","note":"contrary to popular belief kalıbı sık çıkar","n":1,"ex":[]},{"w":"Much as","tr":"her ne kadar ... -se de","g":"Zıtlık","y":"+ cümle","eq":["Although"],"pr":3,"ox":"[[Much as]] I admire the salvage divers, I think the wreck should be left untouched.","oxTr":"Kurtarma dalgıçlarına ne kadar hayran olsam da batığa dokunulmaması gerektiğini düşünüyorum.","note":"much as genelde like, admire gibi fiillerle","n":0,"ex":[]},{"w":"Albeit","tr":"-se de, gerçi","g":"Zıtlık","y":"+ sıfat / zarf / isim öbeği","eq":[],"pr":2,"ox":"The museum reopened, [[albeit]] with a smaller collection.","oxTr":"Müze, daha küçük bir koleksiyonla da olsa yeniden açıldı.","note":"albeit tam cümle almaz: albeit slowly","n":0,"ex":[],"parts":{"p":[["all","tamamen"],["be","olmak"],["it","o"]],"lit":"kelimesi kelimesine: tamamen öyle olsa da → -se de, gerçi"}},{"w":"Regardless of","tr":"-e bakmaksızın, -den bağımsız olarak","g":"Zıtlık","y":"+ isim / "Thanks to","tr":"sayesinde","g":"Neden","y":"+ isim / V-ing","eq":[],"pr":2,"ox":"[[Thanks to]] new sonar technology, the lost submarine was finally found.","oxTr":"Yeni sonar teknolojisi sayesinde kayıp denizaltı nihayet bulundu.","note":"genelde olumlu sonuç bildirir: 'sayesinde'","n":0,"ex":[]},{"w":"As a result of","tr":"-in sonucu olarak, yüzünden","g":"Neden","y":"+ isim / V-ing","eq":["Because of","Due to","Owing to"],"pr":1,"ox":"The hull broke in two [[as a result of]] a torpedo strike.","oxTr":"Gövde bir torpido isabetinin sonucu olarak ikiye ayrıldı.","note":"as a result (virgüllü) = sonuç olarak","n":1,"ex":[]},{"w":"In view of","tr":"-i göz önünde bulundurarak, -den dolayı","g":"Neden","y":"+ isim","eq":[],"pr":3,"ox":"[[In view of]] the site's historical value, diving was banned.","oxTr":"Alanın tarihi değeri göz önünde bulundurularak dalış yasaklandı.","note":"in view of the fact that + cümle","n":0,"ex":[]},{"w":"Seeing that","tr":"-dığına göre, madem ki","g":"Neden","y":"+ cümle","eq":["Now that","Given that"],"pr":3,"ox":"[[Seeing that]] the wreck is so fragile, it should not be raised.","oxTr":"Batık bu kadar kırılgan olduğuna göre yüzeye çıkarılmamalıdır.","n":0,"ex":[]},{"w":"Given that","tr":"-dığı göz önüne alınırsa, -dığına göre","g":"Neden","y":"+ cümle","eq":["Seeing that"],"pr":2,"ox":"[[Given that]] the logbook survived, we know the ship's final course.","oxTr":"Seyir defteri kurtulduğuna göre geminin son rotasını biliyoruz.","note":"given + isim de olur: given its age","n":0,"ex":[]},{"w":"So","tr":"bu yüzden, bu nedenle","g":"Sonuç","y":"+ cümle","eq":[],"pr":2,"ox":"The water was too murky, [[so]] the divers postponed the survey.","oxTr":"Su çok bulanıktı, bu yüzden dalgıçlar taramayı erteledi.","note":"virgülden sonra cümle; so + sıfat + that = o kadar ... ki","n":14,"ex":[]},{"w":"Therefore","tr":"bu nedenle, bu yüzden","g":"Sonuç","y":"cümle başı, virgülle","eq":["Thus","Hence","Consequently","As a result","Accordingly","As a consequence","For this reason"],"pr":1,"ox":"The wreck is a war grave; [[therefore]], removing objects from it is illegal.","oxTr":"Batık bir savaş mezarıdır; bu nedenle ondan nesne çıkarmak yasa dışıdır.","n":13,"ex":[],"parts":{"p":[["there","orada, o"],["fore","(eski) için"]],"lit":"onun için → bu nedenle, bu yüzden"}},{"w":"Thus","tr":"böylece, bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Hence","Consequently","As a result","Accordingly"],"pr":1,"ox":"The minefield blocked the strait. [[Thus]], the Allied fleet could not advance.","oxTr":"Mayın hattı boğazı kapattı. Bu nedenle Müttefik filosu ilerleyemedi.","note":"thus + V-ing = böylece ...-erek","n":4,"ex":[]},{"w":"Hence","tr":"bu nedenle, bundan dolayı","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","Consequently"],"pr":2,"ox":"The ship was built in Glasgow; [[hence]], its plates bear Scottish markings.","oxTr":"Gemi Glasgow'da inşa edildi; bu nedenle saclarında İskoç damgaları var.","note":"hence + isim de alır: hence the name","n":0,"ex":[]},{"w":"Consequently","tr":"sonuç olarak, bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","As a result","As a consequence"],"pr":1,"ox":"The archives were never catalogued. [[Consequently]], many documents remain unknown.","oxTr":"Arşivler hiç kataloglanmadı. Sonuç olarak birçok belge hâlâ bilinmiyor.","n":0,"ex":[]},{"w":"As a result","tr":"sonuç olarak","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Consequently","As a consequence"],"pr":1,"ox":"Trawlers damaged the site. [[As a result]], the area was declared a protected zone.","oxTr":"Trol tekneleri alana zarar verdi. Sonuç olarak bölge koruma alanı ilan edildi.","note":"as a result of + isim = -in sonucu olarak","n":5,"ex":[]},{"w":"Accordingly","tr":"buna göre, bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","Consequently"],"pr":2,"ox":"The wreck contains human remains. [[Accordingly]], it is treated as a war grave.","oxTr":"Batıkta insan kalıntıları bulunuyor. Buna göre savaş mezarı olarak kabul ediliyor.","note":"'buna uygun şekilde' anlamı da var","n":0,"ex":[]},{"w":"As a consequence","tr":"sonuç olarak","g":"Sonuç","y":"cümle başı, virgülle","eq":["As a result","Consequently","Therefore"],"pr":2,"ox":"The hull was breached. [[As a consequence]], the ship sank within minutes.","oxTr":"Gövde delindi. Sonuç olarak gemi dakikalar içinde battı.","note":"as a consequence of + isim","n":0,"ex":[]},{"w":"For this reason","tr":"bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","As a result"],"pr":2,"ox":"Many sailors died on board. [[For this reason]], the wreck is respected as a cemetery.","oxTr":"Birçok denizci gemide öldü. Bu nedenle batık bir mezarlık olarak saygı görüyor.","n":10,"ex":[]},{"w":"That is why","tr":"işte bu yüzden","g":"Sonuç","y":"+ cümle","eq":[],"pr":2,"ox":"The site holds sailors' remains; [[that is why]] diving there is restricted.","oxTr":"Alan denizcilerin kalıntılarını barındırıyor; işte bu yüzden orada dalış kısıtlı.","note":"that is why + sonuç; that is because + neden","n":0,"ex":[]},{"w":"So ... that","tr":"o kadar ... ki","g":"Sonuç","y":"so + sıfat/zarf + that + cümle","eq":[],"pr":1,"ox":"The current was [[so]] strong [[that]] the divers had to abort the dive.","oxTr":"Akıntı o kadar güçlüydü ki dalgıçlar dalışı yarıda kesmek zorunda kaldı.","note":"so + sıfat; such + (a) sıfat + isim","n":0,"ex":[]},{"w":"Such ... that","tr":"öyle ... ki","g":"Sonuç","y":"such + (a/an) sıfat + isim + that + cümle","eq":[],"pr":1,"ox":"It was [[such]] a fragile wreck [[that]] no one was allowed to touch it.","oxTr":"Öyle kırılgan bir batıktı ki kimsenin ona dokunmasına izin verilmedi.","note":"such + isim öbeği; so + sıfat","n":0,"ex":[]},{"w":"So much so that","tr":"o kadar ki, öyle ki","g":"Sonuç","y":"+ cümle","eq":[],"pr":3,"ox":"The site was heavily looted, [[so much so that]] little of the cargo remains.","oxTr":"Alan ağır biçimd ter.","oxTr":"Gemi batarken mürettebat soğuk suya atladı.","note":"as: -irken, çünkü, gibi; bağlama dikkat","k":"As · Zaman","n":0,"ex":[]},{"w":"During","tr":"sırasında, esnasında","g":"Zaman","y":"+ isim","eq":[],"pr":1,"ox":"Many ships were lost [[during]] the Dardanelles campaign.","oxTr":"Çanakkale harekâtı sırasında birçok gemi kaybedildi.","note":"during + isim, while + cümle","n":14,"ex":[]},{"w":"As soon as","tr":"-ir -mez","g":"Zaman","y":"+ cümle","eq":["The moment","Once"],"pr":1,"ox":"[[As soon as]] the permit arrives, the excavation will begin.","oxTr":"İzin gelir gelmez kazı başlayacak.","note":"gelecek anlamda bile present tense","n":0,"ex":[]},{"w":"Once","tr":"-dığında, -dıktan sonra, bir kez ...-ince","g":"Zaman","y":"+ cümle","eq":["As soon as"],"pr":1,"ox":"[[Once]] the wreck had been identified, the families of the crew were informed.","oxTr":"Batığın kimliği belirlendikten sonra mürettebatın ailelerine haber verildi.","note":"'bir zamanlar' zarf anlamıyla karıştırma","n":3,"ex":[]},{"w":"The moment","tr":"-dığı anda, -ir -mez","g":"Zaman","y":"+ cümle","eq":["As soon as"],"pr":2,"ox":"[[The moment]] the sonar image appeared, the team recognised the submarine.","oxTr":"Sonar görüntüsü belirdiği anda ekip denizaltıyı tanıdı.","note":"the minute/the instant da aynı anlamda","n":4,"ex":[]},{"w":"Until","tr":"-e kadar, -inceye dek","g":"Zaman","y":"+ cümle / + isim","eq":[],"pr":1,"ox":"The wreck remained undiscovered [[until]] a fisherman snagged his net on it.","oxTr":"Bir balıkçı ağını takana kadar batık keşfedilmemiş olarak kaldı.","note":"until süreklilik bildirir; by the time 'en geç'","n":3,"ex":[]},{"w":"By the time","tr":"-dığında (çoktan), -ene kadar","g":"Zaman","y":"+ cümle","eq":[],"pr":1,"ox":"[[By the time]] the rescue boats arrived, the ship had already sunk.","oxTr":"Kurtarma tekneleri geldiğinde gemi çoktan batmıştı.","note":"ana cümlede genelde perfect tense","n":0,"ex":[]},{"w":"Before","tr":"-meden önce","g":"Zaman","y":"+ cüml adde örneği, eşanlamlısı değil."}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Dağıtım, teslimat","items":[{"k":"konu:Distribution","tr":"dağıtım, dağılım"},{"k":"konu:Handing out","tr":"dağıtma, elden dağıtım"},{"k":"konu:Delivery","tr":"teslimat, teslim"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"AR-GE (araştırma ve geliştirme)","items":[{"k":"konu:Research and Development","tr":"araştırma ve geliştirme"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Güncelleme, modernleştirme","items":[{"k":"konu:Updating","tr":"güncelleme"},{"k":"konu:Modernizing","tr":"modernleştirme"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Tesis, fabrika","items":[{"k":"konu:Plant","tr":"fabrika, tesis; bitki"},{"k":"konu:Facility","tr":"tesis, imkân"},{"k":"konu:Premises","tr":"bina ve arazisi, mülk"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Montaj, kurulum","items":[{"k":"konu:Assembly","tr":"montaj; meclis"},{"k":"konu:Installation","tr":"kurulum, tesisat"},{"k":"adj:Fitting","tr":"takma, montaj; bağlantı parçası"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Söküm","items":[{"k":"konu:Disassembly","tr":"sökme, demontaj"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Çaba, girişim","items":[{"k":"konu:Endeavour","tr":"çaba, gayret, girişim"},{"k":"konu:Attempt","tr":"girişim, deneme"},{"k":"konu:Effort","tr":"çaba"},{"k":"konu:Try","tr":"deneme, girişim"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Süreç, prosedür","items":[{"k":"konu:Process","tr":"süreç"},{"k":"konu:Procedure","tr":"prosedür, işlem yöntemi"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Çürüme, bozulma","items":[{"k":"konu:Decay","tr":"çürüme, bozulma"},{"k":"konu:Rotting","tr":"çürüme"},{"k":"konu:Corruption","tr":"(veri/metin) bozulma; yolsuzluk","warn":"Genel anlamı 'yolsuzluk'; bilimde veri/metin bozulması."},{"k":"konu:Deterioration","tr":"bozulma, kötüleşme"},{"k":"konu:Corrosion","tr":"korozyon, aşınma"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Aşınma","items":[{"k":"konu:Erosion","tr":"erozyon, aşınma"},{"k":"konu:Wearing out","tr":"yıpranma, aşınma"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Paslanma","items":[{"k":"konu:Rusting","tr":"paslanma"},{"k":"konu:Corrosion","tr":"korozyon, aşınma"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Bakım, onarım","items":[{"k":"konu:Maintenance","tr":"bakım"},{"k":"konu:Overhaul","tr":"elden geçirme, revizyon"},{"k":"konu:Repair","tr":"onarım, tamir"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Alt, dip, taban","items":[{"k":"konu:Bottom","tr":"dip, alt"},{"k":"konu:Base","tr":"taban, temel, üs"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Zirve, tepe","items":[{"k":"konu:Top","tr":"tepe, üst"},{"k":"konu:Pinnacle","tr":"doruk, zirve"},{"k":"konu:Summit","tr":"zirve, doruk"},{"k":"konu:Zenith","tr":"doruk; (astronomi) başucu"},{"k":"konu:Peak","tr":"zirve, tepe noktası"}]},{"u":"Bilim","sec":"Üretimden paslanma ve zirveye","g":"Yüzey, dış yüz","items":[{"k":"konu:Surface","tr":"yüzey"},{"k":"verb:Face","tr":"yüz, cephe"},{"k":"konu:Exterior","tr":"dış yüzey, dış görünüm"}]}],"tk":[{"ws":["Ascend","Descend","Ascending","Descending"],"en":"The diver [[descends]] in a [[descending]] spiral and [[ascends]] in an [[ascending]] one.","tr":"Dalgıç alçalan bir sarmalla iner, yükselen bir sarmalla çıkar.","ip":"de- 'aşağı': de-scend iner. a-scend çıkar; asansör de aynı kökten."},{"ws":["Eminent","Imminent","Prominent","Permanent"],"en":"The [[eminent]] diver warned that [[imminent]] storms threaten the [[prominent]] wreck's [[permanent]] place.","tr":"Saygın dalgıç, yaklaşan fırtınaların göze çarpan batığın kalıcı yerini tehdit ettiğini söyledi.","ip":"eminent saygın kişi, imminent kapıdaki tehlike, prominent öne çıkan, permanent kalıcı (perma-)."},{"ws":["Effective","Efficient","Sufficient","Deficient in"],"en":"An [[effective]] plan and an [[efficient]] crew are [[sufficient]] for a survey [[deficient in]] funds.","tr":"Parası eksik bir araştırma için etkili bir plan ve verimli bir ekip yeterlidir.","ip":"effective işi görür, efficient az kaynakla görür. sufficient yeter, deficient eksik kalır."},{"ws":["Credible","Creditable","Incredible"],"en":"The [[credible]] logbook told a [[creditable]] but almost [[incredible]] story.","tr":"Güvenilir seyir defteri takdire değer ama neredeyse inanılmaz bir hikâye anlattı.","ip":"Hepsi 'inanmak' kökünden (kredi): inanılır, takdiri hak eden, inanılmaz."},{"ws":["Ensure","Insure","Unsure"],"en":"[[Unsure]] of the weather, the owner chose to [[insure]] the ship to [[ensure]] peace of mind.","tr":"Havadan emin olmayan sahip, içi rahat etsin diye gemiyi sigortalattı.","ip":"ensure garantiye almak, insure sigortalamak, unsure emin değil."},{"ws":["Emit","Omit","Permit"],"en":"The wreck may [[emit]] oil; do not [[omit]] it from the report or [[permit]] divers near it.","tr":"Batık petrol salabilir; bunu rapordan atlama ve dalgıçların yaklaşmasına izin verme.","ip":"Kök mit- 'göndermek': e- dışarı (emisyon), o- atlamak, per- geçişe izin."},{"ws":["Explicit","Implicit","Illicit"],"en":"The law is [[explicit]], the warning [[implicit]]: diving on war graves without a permit is [[illicit]].","tr":"Yasa açık, uyarı örtük: izinsiz savaş mezarlarına dalmak yasa dışıdır.","ip":"ex-plicit dışa açılmış, im-plicit içe katlanmış, il-licit izin dışı."},{"ws":["Confirm","Conform to"],"en":"The archive [[confirms]] the date, and the position [[conforms to]] the old chart.","tr":"Arşiv tarihi doğruluyor, konum da eski haritaya uyuyor.","ip":"confirm onaylamak (konfirme), conform to kalıba (form) uymak."},{"ws":["Adverse","Diverse","Advise","Devise"],"en":"In [[adverse]] weather, [[diverse]] teams [[advise]] each other and [[devise]] a new plan.","tr":"Ters havada farklı ekipler birbirine öğüt verir ve yeni bir plan tasarlar.","ip":"ad-verse ters yöne dönmüş, di-verse farklı yönlere. advise öğüt ver, devise tasarla."},{"ws":["Persistent","Existing","Non-existing"],"en":"[[Persistent]] divers search the [[existing]] records for a [[non-existing]] wreck.","tr":"Israrcı dalgıçlar var olan kayıtlarda var olmayan bir batığı arar.","ip":"per-sist sonuna kadar durmak, ex-ist ortaya çıkıp var olmak."},{"ws":["Successive","Successful","Succeed"],"en":"After three [[successive]] storms, the [[successful]] team finally [[succeeded]].","tr":"Art arda üç fırtınadan sonra başarılı ekip sonunda başardı.","ip":"succeed 'arkasından gelmek' de demek: successive art arda, successful başarılı."},{"ws":["Versatile","Infertile","Futile","Fertile"],"en":"A [[versatile]] diver knows a search on [[infertile]] sand is [[futile]]; life hides in the [[fertile]] reef.","tr":"Çok yönlü bir dalgıç kısır kumda aramanın boşuna olduğunu bilir; hayat verimli resifte saklanır.","ip":"fertile verimli, in-fertile kısır; futile boşuna; versatile çok yönlü."},{"ws":["Impartial","Imperious","Imperial","Imperative"],"en":"An [[impartial]] judge, not an [[imperious]] [[imperial]] admiral, should decide; that is [[imperative]].","tr":"Buyurgan bir imparatorluk amirali değil, tarafsız bir yargıç karar vermeli; bu şart.","ip":"im-partial taraf tutmayan. imperial imparatorluk, imperious buyurgan, imperative zorunlu (emir kipi)."},{"ws":["Previous","Perilous","Precious"],"en":"The [[previous]] dive was [[perilous]], but the [[precious]] bell was saved.","tr":"Önceki dalış tehlikeliydi ama değerli çan kurtarıldı.","ip":"pre-vious önceki, peril-ous tehlikeli, preci-ous değerli (price ile akraba)."},{"ws":["Prevailing","Prevail","Prevalent"],"en":"When the [[prevailing]] wind [[prevails]], rust becomes [[prevalent]] on every deck.","tr":"Hâkim rüzgâr baskın çıkınca pas her güvertede yaygınlaşır.","ip":"Üçü de 'üstün gelmek' kökünden: hâkim, baskın çıkmak, yaygın."},{"ws":["Interrupt","Interfere","Interim","Intervene"],"en":"Storms [[interrupt]] the dive, currents [[interfere]], and the [[interim]] director must [[intervene]].","tr":"Fırtınalar dalışı böler, akıntılar işe karışır, geçici müdür müdahale etmek zorunda kalır.","ip":"inter- 'arasında': araya girip kesmek, karışmak, ara dönem, araya girmek."},{"ws":["Undergo","Undermine","Undertake","Understand"],"en":"The hull [[undergoes]] storms that [[undermine]] it; we [[undertake]] a survey to [[understand]] why.","tr":"Gövde onu baltalayan fırtınalar geçiriyor; nedenini anlamak için bir araştırma üstleniyoruz.","ip":"under- 'altında': altından geçmek (yaşamak), altını oymak, altına girmek (üstlenmek)."},{"ws":["Collect","Recollect","Collective"],"en":"We [[collect]] letters so the village can [[recollect]] its [[collective]] memory.","tr":"Köy ortak belleğini hatırlasın diye mektupları topluyoruz.","ip":"collect toplamak (koleksiyon); re-collect anıları yeniden toplamak = hatırlamak."},{"ws":["Discover","Disclose","Dispose"],"en":"Divers [[discover]] the wreck, archives [[disclose]] its name, and nobody may [[dispose]] of its remains.","tr":"Dalgıçlar batığı keşfeder, arşivler adını açıklar, kimse kalıntılarını elden çıkaramaz.","ip":"dis- 'ayırmak': örtüyü kaldırmak, kapağı açmak, kenara koymak."},{"ws":["Reveal","Real","Repeal"],"en":"Sonar will [[reveal]] the [[real]] hull, and the court may [[repeal]] the old salvage law.","tr":"Sonar gerçek gövdeyi ortaya çıkaracak, mahkeme de eski kurtarma yasasını kaldırabilir.","ip":"reveal perdeyi kaldırmak, repeal yasayı geri çağırmak (iptal)."},{"ws":["Assume","Assure"],"en":"Do not [[assume]] the wreck is safe; [[assure]] me you checked the depth.","tr":"Batığın güvenli olduğunu varsayma; derinliği kontrol ettiğine dair bana güvence ver.","ip":"assume varsaymak, assure güvence vermek (sure 'emin')."},{"ws":["Merge","Emerge"],"en":"Two currents [[merge]], and the bow [[emerges]] from the sand.","tr":"İki akıntı birleşir ve pruva kumdan ortaya çıkar.","ip":"merge birleşmek; e-merge 'dalgadan dışarı': ortaya çıkmak."},{"ws":["Feel","Flee","Fuel"],"en":"Sailors [[feel]] the heat and [[flee]] the deck as burning oil [[fuels]] the fire.","tr":"Yanan yağ ateşi körüklerken denizciler sıcağı hisseder ve güverteden kaçar.","ip":"feel hissetmek, flee kaçmak, fuel yakıt; fiil olarak körüklemek."},{"ws":["Foresee","Freeze"],"en":"No one could [[foresee]] the night the strait would [[freeze]].","tr":"Boğazın donacağı geceyi kimse öngöremedi.","ip":"fore-see önceden görmek."},{"ws":["Dire","Fire","Hire","Hide"],"en":"In [[dire]] times the company would [[fire]] old sailors, [[hire]] new ones and [[hide]] the losses.","tr":"Zor zamanlarda şirket eski denizcileri kovar, yenilerini işe alır ve kayıpları saklardı.","ip":"fire kovmak, hire işe almak: biri kapıdan çıkarır, öteki içeri alır."},{"ws":["Propose","Oppose","Suppose","Pose"],"en":"I [[propose]] a dive; you [[oppose]] it, [[suppose]] the worst and say the current [[poses]] a risk.","tr":"Ben dalış öneriyorum; sen karşı çıkıyorsun, en kötüsünü varsayıyorsun ve akıntının risk yarattığını söylüyorsun.","ip":"-pose 'koymak': pro- öne, op- karşıya, sup- altına (varsayım)."},{"ws":["Respect","Reject","Project"],"en":"The board [[respects]] the divers but [[rejects]] the plan they [[projected]].","tr":"Kurul dalgıçlara saygı duyuyor ama tasarladıkları planı reddediyor.","ip":"-ject 'atmak': re- geri atmak (reddetmek), pro- ileri atmak (projelendirmek)."},{"ws":["Deduce from","Reduce","Produce"],"en":"We [[deduce]] from the logs that salt [[reduces]] the steel and [[produces]] holes.","tr":"Seyir defterlerinden tuzun çeliği azalttığı ve delikler açtığı sonucunu çıkarıyoruz.","ip":"-duce 'götürmek': de- sonuç çıkarmak, re- geri götürmek (azaltmak), pro- ileri getirmek (üretmek)."},{"ws":["Indicate","Mitigate","Initiate","Motivate"],"en":"Rising rust may [[indicate]] collapse; to [[mitigate]] it, [[initiate]] a plan and [[motivate]] the team.","tr":"Artan pas çöküşe işaret edebilir; bunu hafifletmek için bir plan başlat ve ekibi motive et.","ip":"Dördü de -ate ile fiil olmuş: göstermek, hafifletmek, başlatmak, güdülemek."},{"ws":["Legitimate","Estimate","Stimulate","Ultimate"],"en":"A [[legitimate]] [[estimate]] can [[stimulate]] research, but the [[ultimate]] answer lies on the seabed.","tr":"Meşru bir tahmin araştırmayı canlandırabilir ama nihai cevap deniz tabanında yatar.","ip":"ultimate en son (ültimatom), stimulate uyarmak (stimülan)."},{"ws":["Determine","Eliminate","Terminate"],"en":"Divers [[determine]] the risk, [[eliminate]] the doubt and [[terminate]] the dive on time.","tr":"Dalgıçlar riski belirler, şüpheyi ortadan kaldırır ve dalışı zamanında bitirir.","ip":"term- 'sınır' (terminal): sınırını koymak, sona erdirmek. e-liminate eşikten dışarı atmak."},{"ws":["Contrary","Contemporary","Temporary"],"en":"[[Contrary]] to [[contemporary]] belief, the ban was only [[temporary]].","tr":"Bugünkü inancın aksine yasak yalnızca geçiciydi.","ip":"tempus 'zaman': temporary geçici, con-temporary aynı zamanın (çağdaş). contrary kontra."},{"ws":["Conventional","Convenient","Intentional"],"en":"The [[conventional]] route was [[convenient]], so the detour was [[intentional]].","tr":"Geleneksel rota elverişliydi, yani sapma kasıtlıydı.","ip":"convention gelenek (konvansiyonel), convenient elverişli, intention niyet."},{"ws":["Consider","Consist of","Considerable","Consistent"],"en":"[[Consider]] this: the site [[consists of]] a [[considerable]] hull, and every report is [[consistent]].","tr":"Şunu düşün: alan hatırı sayılır bir gövdeden oluşuyor ve her rapor tutarlı.","ip":"considerable 'üzerinde düşünülecek kadar' = hatırı sayılır; consistent kendi içinde tutarlı."},{"ws":["Conscious","Concise"],"en":"Be [[conscious]] of the time and keep your dive report [[concise]].","tr":"Zamanın farkında ol ve dalış raporunu kısa ve öz tut.","ip":"conscious bilinçli (science), concise kesilip kısaltılmış."},{"ws":["Complex","Complicated","Compel","Comply with","Complete"],"en":"A [[complex]] wreck and [[complicated]] laws [[compel]] us to [[comply with]] every rule before we [[complete]] the dive.","tr":"Karmaşık bir batık ve çetrefil yasalar, dalışı bitirmeden her kurala uymaya bizi zorlar.","ip":"Hepsi com- ile: compel zorlamak, comply with uymak, complete tamamlamak."},{"ws":["Apprehensive","Comprehend","Comprehensive","Comprise"],"en":"[[Apprehensive]] students [[comprehend]] the [[comprehensive]] report, which [[comprises]] ten chapters.","tr":"Tedirgin öğrenciler on bölümden oluşan kapsamlı raporu kavrar.","ip":"prehend 'kavramak': com- tümüyle kavramak, ap- kötüyü önceden sezmek (tedirgin)."},{"ws":["Proficient","Probable","Profitable"],"en":"A [[proficient]] salvor thought it [[probable]] that the wreck was [[profitable]].","tr":"Yetkin bir kurtarmacı batığın kârlı olmasını muhtemel buldu.","ip":"proficient yetkin, probable muhtemel (prova ile akraba), profitable kârlı."},{"ws":["Prominent","Promise","Promising"],"en":"The [[prominent]] professor [[promised]] a [[promising]] dive.","tr":"Önde gelen profesör ümit verici bir dalış sözü verdi.","ip":"promise söz vermek; promising söz veren = ümit vaat eden."},{"ws":["Prompt","Promote","Proximate","Remote"],"en":"A [[prompt]] reply may [[promote]] the dive to the [[proximate]] wreck, not the [[remote]] one.","tr":"Hızlı bir yanıt, uzaktakine değil en yakın batığa dalışı öne çıkarabilir.","ip":"proximate en yakın (proksimal), remote uzak (uzaktan kumanda)."},{"ws":["Invalid","Invaluable","Valid","Valuable","Available"],"en":"An [[invalid]] permit wastes even [[invaluable]] data; a [[valid]] one makes [[valuable]] records [[available]].","tr":"Geçersiz bir izin en paha biçilmez veriyi bile boşa çıkarır; geçerli bir izin değerli kayıtları kullanılabilir kılar.","ip":"Tuzak: invaluable 'değersiz' değil, değeri biçilemeyecek kadar değerli."},{"ws":["Negligible","Eligible","Reliable","Liable"],"en":"The damage is [[negligible]], the diver [[eligible]], the gear [[reliable]] and the owner [[liable]].","tr":"Hasar önemsiz, dalgıç uygun, ekipman güvenilir, sahibi de sorumlu.","ip":"negligi const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,remember){
  const salt=b64(ENC.salt),iv=b64(ENC.iv),ct=b64(ENC.ct);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const map=JSON.parse(new TextDecoder().decode(pt));
  for(const k in map)if(BYKEY[k])BYKEY[k].ex=map[k];
  LOCKED=false;
  if(remember){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem('yds-key',btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(e){}}
}
async function unlockSaved(){try{const k=localStorage.getItem('yds-key');if(!k)return;
  const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  const map=JSON.parse(new TextDecoder().decode(pt));for(const k2 in map)if(BYKEY[k2])BYKEY[k2].ex=map[k2];LOCKED=false;render()}catch(e){}}

  <form id="uf" style="display:grid;gap:10px;margin-top:10px"><input id="upw" type="password" autocomplete="current-password" placeholder="Parola" style="font:16px var(--body);padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)">

  $('uf').onsubmit=async e=>{e.preventDefault();try{await unlock($('upw').value,true);closeSheet();toast('Tez cümleleri açıldı');render()}catch(er){$('uerr').hidden=false}}}

// study setup
let deckCat='rec',newN=null,front='word';const NN=()=>newN??Math.max(10,Math.min(80,planStat().daily));
function dueItems(){const t=today();return ALL.filter(o=>{const c=S.c[o.key];return c&&c.b>0&&c.due<=t})}
function recOrder(o){if(o.pos==='bag')return o.pr===1?0:o.pr===2?2:6;if(o.pos==='konu')return o.n>0?1:2;if(o.n>0&&(o.pos==='verb'||o.pos==='adj'))return 1;if(o.pos==='np'&&o.n>0)return 3;if(o.pos==='verb'||o.pos==='adj')return 4;if(o.pos==='np')return 5;if(o.pos==='pv'&&o.n>0)return 3;return 7}
function newItems(){let pool=ALL.filter(o=>!S.c[o.key]||!S.c[o.key].s&&S.c[o.key].b===0);if(deckCat==='konu'){const set=new Set(KONU_ALL);pool=pool.filter(o=>set.has(o))}else if(deckCat!=='rec')pool=pool.filter(o=>o.pos===deckCat);else pool.sort((a,b)=>recOrder(a)-recOrder(b));return pool}

   <p class="note">Hesap: öğrenmediğin kelimeler, son 3 gün tekrara ayrılarak kalan günlere bölündü. Bildiğin kelimeleri taradıkça bu sayı düşer.</p>
   ${P.unseen?`<p><b>Önce hızlı tarama.</b> Sıfırdan başlamıyorsun: hiç bakmadığın ${P.unseen} kelime var. Bildiklerine “Biliyorum” de, öğrenilmiş sayılsınlar. İlk birkaç günde hepsini tararsan, kalan günler gerçekten bilmediklerine kalır.</p><button class="btn fill reveal" data-sweep>Hızlı taramaya başla (50 kelime)</button>`:'<p class="note" style="color:var(--ok)">Bütün kelimeleri taradın.</p>'}</section>`+`<section class="panel"><h2>Bugün</h2><p><b>${due.length}</b> tekrar sırası gelen kart, <b>${Math.min(newN_,nw.length)}</b> yeni kart.</p>
   <div><span class="lbl">Yeni kartlar nereden gelsin?</span><div class="chips wrapy" style="margin-top:6px">${[['rec','Önerilen sıra']].concat(CATS).map(([c,l])=>`<button class="chip" data-deck="${c}" aria-pressed="${c===deckCat}">${l}</button>`).join('')}</div></div>
   <div><span class="lbl">Günlük yeni kart</span><div class="seg"><button data-newn="auto" aria-pressed="${newN==null}">Plana göre (${Math.max(10,Math.min(80,P.daily))})</button>${[20,40,60].map(n=>`<button data-newn="${n}" aria-pressed="${n===newN}">${n}</button>`).join('')}</div></div>
   <div><span class="lbl">Kartın önü</span><div class="seg">${[['word','Kelime'],['cloze','Tez cümlesinde boşluk']].map(([f,l])=>`<button data-front="${f}" aria-pressed="${f===front}">${l}</button>`).join('')}</div>${front==='cloze'?`<p class="note" style="margin-top:6px">Tezinde geçen kelimeler, tezinden bir cümlede boşluk olarak gelir. Tezde geçmeyenler kelime kartı olarak gelir.${LOCKED?' Önce İlerleme’den ya da bir kelimeden tez cümlelerinin kilidini aç.':''}</p>`:''}</div>
   <button class="btn fill reveal" data-start ${due.length+Math.min(newN_,nw.length)?'':'disabled'}>Çalışmaya başla</button></section>
   <section class="panel"><h2>Önerilen sıra</h2><p class="note">YDS’nin 80 sorusunun 5’i doğrudan bağlaç, 2’si edat; boşluk doldurma, cümle tamamlama ve çeviri de bağlaç ve kalıp bilgisi ister. Bu yüzden önerilen sıra şöyle: sık çıkan bağlaçlar, tezinde geçen fiil ve sıfatlar, öteki bağlaçlar, isim + edat kalıpları, kalan fiil ve sıfatlar, en son phrasal verb’ler.</p></section>
   <section class="panel"><h2>Nasıl çalışır?</h2><p class="note">Kartın önünde kelime var. Anlamını düşün, “Göster”e bas. Bilemediysen “Bilmiyorum”: kart bugün yeniden gelir. “Zor”: yarın gelir. “Biliyorum”: 1, 2, 4, 8, 16 gün arayla seyrekleşir. Dördüncü kutuya ulaşan kelime öğrenilmiş sayılır.</p></section>`}
function vIlerleme(){
  const t=today(),d=S.d;let streak=0,x=(d[t]||[0])[0]>0?t:t-1;while((d[x]||[0])[0]>0){streak++;x--}
  const learned=ALL.filter(o=>isL(o.key)).length,rev=(d[t]||[0,0,0])[0];
  const days=[...Array(14)].map((_,i)=>t-13+i),mx=Math.max(5,...days.map(x=>(d[x]||[0])[0]));
  const hard=ALL.filter(o=>heat(o.key)>0).sort((a,b)=>S.c[b.key].l-S.c[a.key].l).slice(0,30);

  <section class="panel"><h2>Kademeler</h2><p class="note">Her türde öğrendiğin kelimelerin oranına göre 5 kademe var: %10’da 2. kademe, %35’te 3., %65’te 4., %95’te 5. Kırmızı çizgiler bilemediğin kelimeler.</p>
   ${CATS.map(([c,l])=>{const st=catStat(c);return `<div class="lvc"><div class="lvh"><b>${l}</b>${lvDots(st.lv)}<span class="lvn">${st.lv}. kademe · ${st.name}</span></div>
    <div class="lvbar"><i class="k" style="width:${st.p}%"></i><i class="r" style="width:${st.n?st.h/st.n*100:0}%"></i>${LV.slice(1).map(x=>`<span class="tick" style="left:${x[0]}%"></span>`).join('')}</div>
    <div class="lvm"><span>${st.k} / ${st.n} öğrenildi (%${Math.round(st.p)})</span><span>${st.s} çalışıldı${st.h?` · <b style="color:var(--warn)">${st.h} zorlanılan</b>`:''}</span></div>
    ${st.next?`<div class="note">“${st.nextName}” kademesine <b>${st.next}</b> kelime kaldı.</div>`:'<div class="note" style="color:var(--ok)">Bu türü bitirdin.</div>'}</div>`}).join('')}</section>
  <section class="panel"><h2>Tezinde kullanım</h2><p class="note">Her türden kaç kelimenin tezinin İngilizce metninde geçtiği.</p><div class="prog">${CATS.map(([c,l])=>{const n=LIST(c).length,k=LIST(c).filter(o=>o.n>0).length,p=n?Math.round(k/n*100):0;return `<div class="pr"><span>${l}</span><span class="tr2"><i style="width:${p}%;background:var(--brass)"></i></span><span>%${p} · ${k}/${n}</span></div>`}).join('')}</div>
   <span class="lbl">Tezinde en sık geçenler</span><div class="chips wrapy">${ALL.filter(o=>o.n>0).sort((a,b)=>b.n-a.n).slice(0,24).map(o=>chipW(o,o.w+' · '+o.n)).join('')}</div></section>
  ${hard.length?`<section class="panel"><h2>Zorlandıkların</h2><p class="note">“Bilemedim” dediğin, henüz öğrenmediğin kelimeler. Ne kadar çok bilemediysen o kadar kırmızı.</p><div class="chips wrapy">${hard.map(o=>chipW(o)).join('')}</div></section>`:''}
  ${recent.length?`<section class="panel"><h2>Son öğrendiklerin</h2><div class="chips wrapy">${recent.map(o=>chipW(o)).join('')}</div></section>`:''}
  <section class="panel"><h2>Kayıt</h2><p class="note">${esc(syncMsg)}. ${MODE==='artifact'?'Bu sayfayı Claude’da açtığında ilerlemen hesabına kaydedilir ve her cihazda aynı yerden devam edersin.':'İlerlemen bu cihazın tarayıcısında saklanır. Cihaz değiştirirken ya da yedek almak için yedek dosyası indir, öteki cihazda geri yükle.'}</p>
   <div class="acts">${LOCKED?'<button class="btn" data-unlock>Tez cümlelerinin kilidini aç</button>':''}<button class="btn" data-backup>Yedek indir</button><label class="btn" style="display:inline-flex;align-items:center">Yedeği geri yükle<input type="file" accept="application/json,.json" id="restore" hidden></label></div></section>`}
function vSearch(q){
  const rank=o=>{const w=o.w.toLowerCase();return w===q?0:w.startsWith(q)?1:w.includes(q)?2:3};
  const R=ALL.filter(o=>hit(o,q)).sort((a,b)=>rank(a)-rank(b)||a.w.localeCompare(b.w));
  const T=TK.map((t,i)=>[t,i]).filter(([t])=>t.ws.some(w=>w.toLowerCase().includes(q))||t.en.toLowerCase().includes(q)||low(t.tr).includes(q));
  return `<p class="lead">Bütün sözlükte <b>${R.length}</b> sonuç${T.length?`, <b>${T.length}</b> tekerleme`:''}.</p>`+(R.length?`<div class="list">${R.slice(0,limit).map(o=>rowHtml(o).replace('<span class="rw">',`<span class="rw"><span class="bd" style="font-size:11px;vertical-align:3px;margin-right:6px">${CATN[o.pos]}</span>`)).join('')}</div>${R.length>limit?'<button class="btn more" data-more>Daha fazla göster</button>':''}`:'<p class="empty">Bulunamadı. Türkçe anlamla da arayabilirsin.</p>')+T.slice(0,8).map(([t,i])=>tkHtml(t,i)).join('');
}
function render(){
  const q=qv();$('qx').hidden=!q;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===cur?'page':'false'));
  const v=$('view');
  if(studying&&!q){v.innerHTML='<div class="studyv"><div class="sh"><button class="btn" data-endstudy>Bitir</button><div class="pbar"><i id="pfill"></i></div><span class="sn" id="pcount"></span></div><div class="scard" id="scard"></div><div class="sfoot" id="sfoot"></div></div>';setSync(syncMsg);renderMeters();drawStudy();return}
  v.innerHTML=q?vSearch(q):cur==='sozluk'?vSozluk():cur==='kesfet'?vKesfet():cur==='calis'?vCalis():vIlerleme();

  const ed=$('examd');if(ed)ed.onchange=()=>{const v=ed.value;if(!v)return;const t=Math.floor(Date.parse(v+'T00:00:00Z')/864e5);if(t>today()){S.exam=t;S.examSet=2;changed();render()}};

}

// ---------- exam plan ----------
const YDS_AT=Date.parse('2026-11-22T10:15:00+03:00');const YDS_DAY=Math.floor(Date.UTC(2026,10,22)/864e5);const EXAM_DEFAULT=YDS_DAY;
const examDay=()=>S.exam||EXAM_DEFAULT;
function planStat(){const left=Math.max(1,examDay()-today());const un=ALL.filter(o=>!isL(o.key));const unseen=ALL.filter(o=>!S.c[o.key]?.s);const study=Math.max(1,left-3);
  return {left,un:un.length,unseen:unseen.length,daily:Math.ceil(un.length/study),sweep:Math.ceil(unseen.length/Math.max(1,Math.min(5,left)))}}
const isoDay=d=>new Date(d*864e5).toISOString().slice(0,10);


function countdown(){const e=$('cd');if(!e)return;const ms=(S.examSet===2?(S.exam*864e5+7*3600e3+15*6e4-3*3600e3):YDS_AT)-Date.now();
  if(ms<=0){e.innerHTML='<b>Sınav günü</b>';return}const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  e.innerHTML=`<span>${S.examSet===2?'Sınavına':'2026-YDS/2 · 22 Kasım 10.15'}</span><b>${d} gün ${h} sa ${m} dk</b>`}
setInterval(countdown,30000);

// ---------- study ----------
let Q=[],qi=0,shown=false,done=0,total=0,again=new Set(),studying=false,smode='srs';
function startSweep(){smode='tara';let pool=ALL.filter(o=>!S.c[o.key]?.s);if(deckCat!=='rec')pool=pool.filter(o=>o.pos===deckCat);else pool.sort((a,b)=>recOrder(a)-recOrder(b));Q=pool.slice(0,50);if(!Q.length){toast('Taranacak kelime kalmadı');return}qi=0;done=0;total=Q.length;again=new Set();shown=false;studying=true;render();window.scrollTo({top:0})}
function sweep(k,know){const c=S.c[k]||{b:0,due:0,s:0,k:0,l:0};const was=c.b>=4;c.s=(c.s||0)+1;if(know){c.b=Math.max(c.b,4);c.due=today()+4;c.k++}else{c.b=1;c.due=today()}c.u=Date.now();S.c[k]=c;bump(0);if(know)bump(1);if(know&&!was)bump(2);changed()}
function startStudy(){smode='srs';const due=dueItems();const nw=newItems().slice(0,NN());Q=[...due.sort(()=>Math.random()-.5),...nw];if(!Q.length)return;qi=0;done=0;total=Q.length;again=new Set();shown=false;studying=true;render();window.scrollTo({top:0})}
function closeStudy(){studying=false;render();window.scrollTo({top:0})}
function drawStudy(){
  $('pfill').style.width=(done/Math.max(total,1)*100)+'%';$('pcount').textContent=`${done} / ${total}`;
  if(qi>=Q.length){$('scard').innerHTML=smode==='tara'?`<div class="big">Tarama bitti</div><p class="hint">${done} kelime taradın. Bildiklerin öğrenildi sayıldı, 4 gün sonra bir kez daha sorulacak. Bilmediklerin bugünkü çalışmaya eklendi.</p>`:`<div class="big">Bitti</div><p class="hint">${done} kart çalıştın. Bugünkü tekrar: ${(S.d[today()]||[0])[0]}.</p>`;$('sfoot').innerHTML='<button class="btn fill reveal" id="sdone">Kapat</button>';$('sdone').onclick=closeStudy;return}
  const o=Q[qi];
  if(smode==='tara'){$('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span><span class="bd y">Hızlı tarama</span></div><div class="big">${esc(o.w)}</div>${shown?`<div class="ans">${esc(o.tr)}</div>${o.y?`<p class="hint">${esc(o.y)}</p>`:''}`:'<p class="hint">Anlamını biliyor musun? Emin değilsen “Anlamı” ile bak.</p>'}`;
    $('sfoot').innerHTML=`${shown?'':'<button class="btn" id="sshow">Anlamı</button>'}<div class="answers" style="grid-template-columns:1fr 1fr"><button class="a0" data-sw="0">Bilmiyorum<small>çalışma listesine</small></button><button class="a2" data-sw="1">Biliyorum<small>4 gün sonra kontrol</small></button></div>`;
    if(!shown)$('sshow').onclick=()=>{shown=true;drawStudy()};return}
  const cz=front==='cloze'&&o.ex&&o.ex.length?o.ex[qi%o.ex.length]:null;
  if(cz&&!shown){$('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span><span class="bd y">Tezinden</span></div><p class="ex" style="font-size:19px">${esc(cz).replace(/\[\[(.+?)\]\]/g,'<b style="letter-spacing:.1em">_____</b>')}</p><p class="hint">Boşluğa hangi kelime gelir?</p>`;$('sfoot').innerHTML='<button class="btn fill reveal" id="sshow">Göster</button>';$('sshow').onclick=()=>{shown=true;drawStudy()};return}
  $('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span>${o.y&&shown?`<span class="bd y">${esc(o.y)}</span>`:''}</div><div class="big">${wDisp(o)}</div>`+(cz?`<p class="ex">${exHtml(cz)}</p>`:'')+(shown?`<div class="ans">${esc(o.tr)}</div>${detail(o,false).replace(/<div class="acts">[\s\S]*?<\/div><\/div>$/,'</div>').replace('<div class="badges">','<div class="badges" hidden>')}`:'<p class="hint">Anlamını düşün, sonra göster.</p>');
  $('sfoot').innerHTML=shown?`<div class="answers"><button class="a0" data-g="0">Bilmiyorum<small>bugün yine</small></button><button class="a1" data-g="1">Zor<small>yarın</small></button><button class="a2" data-g="2">Biliyorum<small>${INT[Math.min(7,box(o.key)+1)]} gün sonra</small></button></div>`:'<button class="btn fill reveal" id="sshow">Göster</button>';
  if(!shown)$('sshow').onclick=()=>{shown=true;drawStudy()};
}
function answer(g){const o=Q[qi];grade(o.key,g);if(g===0&&!again.has(o.key)){again.add(o.key);Q.splice(Math.min(Q.length,qi+4),0,o);total++}done++;qi++;shown=false;drawStudy()}

let inlAnchor=null;
function openSheet(html,anchor){closeSheet();const p=document.createElement('section');p.className='panel inl';p.id='inl';p.innerHTML='<button class="x" data-closeinl aria-label="Kapat">×</button>'+html;
  const a=anchor||inlAnchor;if(a&&a.isConnected){a.after(p)}else{$('view').prepend(p)}inlAnchor=a||null;try{p.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}

// ---------- backup ----------
async function backup(){const data=JSON.stringify(S);const name=`yds-ilerleme-${new Date().toISOString().slice(0,10)}.json`;
  try{if(MODE==='artifact'&&window.claude){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data});return}}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('İndirme başlatılamadı')}}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.c)throw 0;S=merge(S,o);changed();render();toast('Yedek geri yüklendi')}catch(er){toast('Bu dosya bir yedek değil')}};r.readAsText(f)}

  const t=e.target.closest('button,[data-sheet]');if(!t)return;const ds=t.dataset;
  if(ds.tab){studying=false;cur=ds.tab;$('q').value='';limit=60;render();window.scrollTo({top:0});return}
  if(ds.cat){cat=ds.cat;limit=60;render();return}
  if(ds.unit){unit=ds.unit;limit=60;render();return}
  if(ds.filt){filt=ds.filt;limit=60;render();return}
  if(ds.kes){kesfet=ds.kes;render();return}
  if(ds.more!==undefined){limit+=80;render();return}
  if(ds.open){const it=t.parentElement;const d=it.querySelector('.det');if(d){d.remove();t.setAttribute('aria-expanded','false')}else{it.insertAdjacentHTML('beforeend',detail(BYKEY[ds.open],false));t.setAttribute('aria-expanded','true')}return}
  if(ds.closeinl!==undefined){closeSheet();return}
  if(ds.sheet){const anc=t.closest('.chips,.pairs')||t;openSheet(detail(BYKEY[ds.sheet],true),anc);return}
  if(ds.learn){const k=ds.learn;setLearned(k,!isL(k));renderMeters();const it=document.getElementById('it-'+k);if(it&&!t.closest('#inl')){it.outerHTML=rowHtml(BYKEY[k]);const n=document.getElementById('it-'+k);n.insertAdjacentHTML('beforeend',detail(BYKEY[k],false));n.querySelector('.row').setAttribute('aria-expanded','true')}else{openSheet(detail(BYKEY[k],true));const r=document.getElementById('it-'+k);if(r)r.outerHTML=rowHtml(BYKEY[k])}toast(isL(k)?'Öğrenildi olarak işaretlendi':'İşaret kaldırıldı');return}
  if(ds.miss){const k=ds.miss;grade(k,0);const it=document.getElementById('it-'+k);if(it&&!t.closest('#inl')){it.outerHTML=rowHtml(BYKEY[k]);const n=document.getElementById('it-'+k);n.insertAdjacentHTML('beforeend',detail(BYKEY[k],false));n.querySelector('.row').setAttribute('aria-expanded','true')}else{openSheet(detail(BYKEY[k],true));const r=document.getElementById('it-'+k);if(r)r.outerHTML=rowHtml(BYKEY[k])}renderMeters();toast('Bugün yeniden sorulacak');return}
  if(ds.unlock!==undefined){unlockSheet();return}
  if(ds.say){speak(TK[+ds.say].en);return}
  if(ds.deck){deckCat=ds.deck;render();return}
  if(ds.newn){newN=ds.newn==='auto'?null:+ds.newn;render();return}
  if(ds.front){front=ds.front;render();return}

  if(ds.sweep!==undefined){startSweep();return}
  if(ds.exam!==undefined){return}
  if(ds.endstudy!==undefined){closeStudy();return}
  if(ds.backup!==undefined){backup();return}
});
