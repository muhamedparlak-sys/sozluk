<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YDS Sözlüğü</title><meta name="theme-color" content="#0e5a78"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="YDS Sözlüğü"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one thumb-reachable column. Sticky search on top, scrolling log below, fixed four-tab bar at the bottom; study mode is a full-screen card with answers at thumb height. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --fg:#14232d; --muted:#5b6b75; --line:#d5dde2;
  --accent:#0e5a78; --brass:#a3762b; --hl:#fbe9c4; --ok:#2f7a4f; --warn:#b2452c; --soft:#e3ebef;
  --display:"Spectral",Georgia,serif; --body:"Source Sans 3",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d171d; --surface:#14222b; --fg:#e4ecf0; --muted:#93a5b0; --line:#25363f;
  --accent:#5fb3d6; --brass:#d7aa5c; --hl:#4a3a17; --ok:#6cc391; --warn:#ec8a6c; --soft:#1a2b35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171d; --surface:#14222b; --fg:#e4ecf0; --muted:#93a5b0; --line:#25363f;
  --accent:#5fb3d6; --brass:#d7aa5c; --hl:#4a3a17; --ok:#6cc391; --warn:#ec8a6c; --soft:#1a2b35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.top h1{margin:0;font:700 21px/1.1 var(--display)}
.sync{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.search{position:relative}
#q{width:100%;font:16px var(--body);padding:11px 38px 11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
#qx{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:36px;height:36px;color:var(--muted);font-size:20px;cursor:pointer}
main{padding-block:12px calc(env(safe-area-inset-bottom,0px) + 32px)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapy{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 14px var(--body);color:var(--muted);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip.w{font-weight:600;color:var(--fg);padding:5px 11px;min-height:32px}
.chip.w.tz{text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px}
.chip.w.ok{color:var(--ok);border-color:var(--ok)}
.seg{display:flex;gap:4px;margin-top:8px}
.seg button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;padding:7px 4px;font:600 13px var(--body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.lead{color:var(--muted);margin:12px 0 4px;font-size:15px;max-width:62ch}
.lead b{color:var(--fg)}
.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec h2{margin:0;font:700 18px var(--display)}
.sec .m{color:var(--brass);font-weight:600;font-size:14px}
.sec .c{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.list{display:grid;gap:6px;margin-top:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;padding:11px 14px;cursor:pointer;min-height:52px}
.row:focus-visible{outline:2px solid var(--brass);outline-offset:-2px;border-radius:10px}
.rw{font:700 18px/1.2 var(--display);min-width:0;overflow-wrap:anywhere}
.rt{grid-column:1;color:var(--muted);font-size:14px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{grid-column:2;grid-row:1/3;display:flex;gap:6px;align-items:center}
.tz{font:500 11px var(--mono);color:var(--brass)}
.dots{display:flex;gap:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.done{color:var(--ok);font-weight:700}
.det{padding:0 14px 14px;display:grid;gap:10px;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bd{font:500 12px var(--mono);border-radius:5px;padding:2px 7px;background:var(--soft);color:var(--accent)}
.bd.y{color:var(--brass)}
.ex{margin:0;padding-left:12px;border-left:2px solid var(--line);font:italic 500 16px/1.5 var(--display)}
.ex.own{border-left-style:dashed}
.extr{margin:-4px 0 0 14px;font-size:14px;color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px;font-style:normal;font-weight:700}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.note{font-size:14px;color:var(--muted)}
.fix{font-size:14px;color:var(--warn);border-left:2px solid var(--warn);padding-left:8px}
.morph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;font:500 14px var(--mono)}
.morph i{font-style:normal;color:var(--muted)}
.mp{color:var(--accent);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.mg{font:13px var(--body);color:var(--muted);margin-left:4px}
.link{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:14px;padding:7px 10px;border-radius:8px;background:var(--bg)}
.link b{font:700 16px var(--display);color:var(--ok)}
.link.t-yalanci b{color:var(--warn)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:9px;padding:9px 14px;font:600 15px var(--body);cursor:pointer;min-height:42px}
.btn.fill{background:var(--accent);color:var(--bg)}
.btn.okb{border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.45;cursor:default}
.more{width:100%;margin-top:10px}
.empty{color:var(--muted);padding:20px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;margin-top:12px}
.panel h2{margin:0;font:700 19px var(--display)}
.panel p{margin:0}
.fnr{display:grid;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.fnl b{font:500 14px var(--mono);color:var(--accent);margin-right:8px}
.fnl span{font-size:14px;color:var(--muted)}
.tken{margin:0;font:500 18px/1.5 var(--display)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:15px;min-height:32px;display:flex;align-items:center}
.pairs{display:grid;gap:6px}
.pair{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.pair .pw{font:700 17px var(--display)}
.pair .pt{font-weight:700;color:var(--ok);justify-self:end}
.pair.t-yalanci .pt{color:var(--warn)}
.pair .pn{grid-column:1/3;font-size:14px;color:var(--muted)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;padding-top:6px}
.bar{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bar.today{background:var(--brass)}
.bx{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font:500 10px var(--mono);color:var(--muted);text-align:center}
.prog{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:14px}
.pr .tr2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pr .tr2 i{display:block;height:100%;background:var(--ok)}
.pr span:last-child{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:2px;font:600 12px var(--body);color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{font:600 10px var(--mono);background:var(--brass);color:var(--surface);border-radius:999px;padding:0 5px;margin-left:2px}
/* study */
.study{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sh .x{border:0;background:none;font-size:26px;width:40px;height:40px;cursor:pointer;color:var(--muted)}
.pbar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sn{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sbody{overflow:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 16px;display:grid;align-content:center}
.scard{max-width:620px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:grid;gap:12px}
.scard .big{font:700 clamp(30px,9vw,44px)/1.1 var(--display);text-align:center;overflow-wrap:anywhere}
.scard .hint{text-align:center;color:var(--muted)}
.scard .ans{text-align:center;font:600 20px var(--body);color:var(--brass)}
.sfoot{padding:10px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px;max-width:720px;width:100%;margin:0 auto}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.answers button{min-height:58px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 16px var(--body);cursor:pointer;display:grid;line-height:1.15}
.answers button small{font:500 11px var(--mono);color:var(--muted)}
.answers .a0{color:var(--warn);border-color:var(--warn)}
.answers .a1{color:var(--brass);border-color:var(--brass)}
.answers .a2{color:var(--ok);border-color:var(--ok)}
.reveal{min-height:58px;border-radius:12px;font-size:17px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,20,26,.45);display:grid;align-items:end}
.sheet .in{background:var(--bg);border-radius:16px 16px 0 0;max-height:86vh;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;width:100%;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:60;max-width:90vw}
@media (prefers-reduced-motion:reduce){.pbar i{transition:none}}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}

/* levels and heat */
.meters{all:unset;box-sizing:border-box;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-bottom:10px;cursor:pointer}
.meters:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.mt{display:grid;gap:3px;min-width:0}
.ml{font:600 11px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb{height:5px;border-radius:3px;background:var(--soft);overflow:hidden}
.mb i{display:block;height:100%;background:var(--ok)}
.lvd{display:inline-flex;gap:2px}
.lvd i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.lvd i.on{background:var(--brass)}
.lvc{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.lvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvh b{font:700 17px var(--display)}
.lvn{margin-left:auto;font-size:13px;color:var(--brass);font-weight:600}
.lvbar{position:relative;height:12px;border-radius:6px;background:var(--soft);overflow:hidden;display:flex}
.lvbar i.k{background:var(--ok)}
.lvbar i.r{background:var(--warn)}
.lvbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface);opacity:.9}
.lvm{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.item.h1{background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.item.h2{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.item.h3{background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-color:var(--warn)}
.item.h2 .rw,.item.h3 .rw{color:var(--warn)}
.item.lrn{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.w.h1{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.chip.w.h2{border-color:var(--warn);color:var(--warn)}
.chip.w.h3{border-color:var(--warn);background:var(--warn);color:var(--surface)}
.btn.nob{border-color:var(--warn);color:var(--warn)}

/* top tabs (in-flow; no fixed overlays) */
.tabs4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs4 .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:9px;font:600 12px var(--body);color:var(--muted);cursor:pointer;min-height:48px;justify-content:center}
.tabs4 .tab svg{width:21px;height:21px}
.tabs4 .tab[aria-current="page"]{background:var(--accent);color:var(--bg)}
.tabs4 .tab[aria-current="page"] .badge{background:var(--bg);color:var(--accent)}
.inl{position:relative;border-color:var(--accent)}
.inl .x{position:absolute;right:6px;top:6px;border:0;background:none;font-size:24px;width:40px;height:40px;color:var(--muted);cursor:pointer}
.studyv{display:grid;gap:12px}
.studyv .sh{padding:0}
.studyv .sfoot{padding:0}
.sync.flash{color:var(--ok);font-weight:600}
.mv{display:flex;align-items:center;justify-content:space-between;gap:4px}
.mp2{font:500 10px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.kg{gap:8px;padding:12px}
.kgh{margin:0;font:700 17px var(--display)}
.kgh .c{font:500 12px var(--mono);color:var(--muted)}
.item.wrn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.sp{color:var(--brass);font-weight:400;margin:0 1px}
.parts{display:grid;gap:4px}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pc{display:grid;justify-items:center;border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--bg)}
.pc b{font:700 16px var(--display)}
.pc small{font-size:12px;color:var(--muted)}
.pplus{color:var(--muted)}
</style></head><body><header class="top"><div class="wrap">

<nav class="tabs4" aria-label="Bölümler">

  <button class="tab" data-tab="kesfet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Keşfet</button>
  <button class="tab" data-tab="calis"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="15" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v13"/></svg><span>Çalış<span class="badge" id="duebadge" hidden></span></span></button>

  <div class="search"><input id="q" type="search" placeholder="Ara: kelime ya da Türkçe anlam" aria-label="Tüm sözlükte ara" autocomplete="off"><button id="qx" aria-label="Aramayı temizle" hidden>×</button></div>

ough"],"pr":1,"ox":"[[Though]] the archive was damaged by fire, most naval logs survived.","oxTr":"Arşiv yangında hasar görmüş olsa da, deniz seyir defterlerinin çoğu kurtuldu.","note":"cümle sonunda zarf olarak 'yine de' anlamı da var","n":0,"ex":[]},{"w":"Even though","tr":"-diği halde, -e rağmen (vurgulu)","g":"Zıtlık","y":"+ cümle","eq":["Although","Though"],"pr":1,"ox":"[[Even though]] the currents were strong, the team completed the survey.","oxTr":"Akıntılar güçlü olduğu halde ekip taramayı tamamladı.","note":"even though gerçek durum; even if varsayım","n":0,"ex":[]},{"w":"While","tr":"oysa, -e karşın; -diği halde","g":"Zıtlık","y":"+ cümle","eq":["Whereas"],"pr":1,"ox":"[[While]] some wrecks are well preserved, others have been looted by souvenir hunters.","oxTr":"Bazı batıklar iyi korunmuşken, diğerleri hatıra avcıları tarafından yağmalanmıştır.","note":"while hem zaman ('-irken') hem zıtlık bildirir","k":"While · Zıtlık","n":0,"ex":[]},{"w":"Whereas","tr":"oysa, -e karşın","g":"Zıtlık","y":"+ cümle","eq":["While"],"pr":1,"ox":"The British ships sank in deep water, [[whereas]] the French vessels lie close to shore.","oxTr":"İngiliz gemileri derin suda battı, oysa Fransız gemileri kıyıya yakın yatıyor.","note":"whereas yalnızca zıtlık bildirir, zaman anlamı yoktur","n":2,"ex":[],"parts":{"p":[["where","nerede"],["as","olarak"]],"lit":"where + as: anlamı kelimelerden çıkmaz → oysa, -iken"}},{"w":"However","tr":"ancak, fakat, bununla birlikte","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Nevertheless","Nonetheless"],"pr":1,"ox":"The wreck was located in 2004. [[However]], it was not identified until a decade later.","oxTr":"Batık 2004'te bulundu. Ancak on yıl sonrasına kadar kimliği belirlenemedi.","note":"however + sıfat = ne kadar ... olursa olsun","n":25,"ex":[],"parts":{"p":[["how","nasıl"],["ever","her zaman, hiç"]],"lit":"nasıl olursa olsun → bununla birlikte; anlam kısmen mecazi"}},{"w":"Nevertheless","tr":"yine de, buna rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Nonetheless","However","Even so"],"pr":1,"ox":"Visibility was poor. [[Nevertheless]], the divers recorded the ship's name plate.","oxTr":"Görüş kötüydü. Yine de dalgıçlar geminin isim plakasını kayda aldı.","n":3,"ex":[],"parts":{"p":[["never","asla"],["the",""],["less","daha az"]],"lit":"kelimesi kelimesine: asla daha az değil → yine de"}},{"w":"Nonetheless","tr":"yine de, buna rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Nevertheless","However","Even so"],"pr":2,"ox":"Funding was limited; [[nonetheless]], the project produced a detailed site map.","oxTr":"Fon sınırlıydı; yine de proje ayrıntılı bir alan haritası üretti.","n":0,"ex":[],"parts":{"p":[["none","hiç"],["the",""],["less","daha az"]],"lit":"hiç de daha az değil → yine de, buna rağmen"}},{"w":"Yet","tr":"ama, ne var ki, yine de","g":"Zıtlık","y":"+ cümle","eq":["But"],"pr":2,"ox":"The submarine was lost in 1915, [[yet]] its exact location remained a mystery for decades.","oxTr":"Denizaltı 1915'te kayboldu, ne var ki tam yeri on yıllarca gizem olarak kaldı.","note":"olumsuz cümlede ve cümle sonunda 'henüz' anlamı da var","n":4,"ex":[]},{"w":"But","tr":"ama, fakat","g":"Zıtlık","y":"+ cümle","eq":["Yet"],"pr":2,"ox":"The divers searched all day, [[but]] they found no trace of the anchor.","oxTr":"Dalgıçlar bütün gün aradı, ama çapadan hiçbir iz bulamadılar.","n":26,"ex":[]},{"w":"Still","tr":"yine de, buna rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Even so","All the same"],"pr":2,"ox":"The hull is badly corroded. [[Still]], its shape is clearly visible on sonar images.","oxTr":"Gövde ciddi biçimde paslanmış. Yine de şekli sonar görüntülerinde açıkça seçiliyor.","note":"'hâlâ' anlamıyla karıştırma","n":4,"ex":[]},{"w":"Despite","tr":"-e rağmen","g":"Zıtlık","y":"+ isim / V-ing","eq":["In spite of","Notwithstanding"],"pr":1,"ox":"[[Despite]] the strong currents, the team reached the wreck safely.","oxTr":"Güçlü akıntılara rağmen ekip batığa güvenle ulaştı.","note":"despite + isim, although + cümle; 'despite of' yanlış","n":1,"ex":[]},{"w":"In spite of","tr":"-e rağmen","g":"Zıtlık","y":"+ isim / V-ing","eq":["Despite","Notwithstanding"],"pr":1,"ox":"[[In spite of]] being underwater for a century, the guns remain intact.","oxTr":"Bir asırdır su altında olmasına rağmen toplar sağlam duruyor.","note":"in spite of the fact that + cümle","n":0,"ex":[]},{"w":"Notwithstanding","tr":"-e rağmen (resmi)","g":"Zıtlık","y":"+ isim / V-ing","eq":["Despite","In spite of"],"pr":3,"ox":"[[Notwithstanding]] the legal protections, illegal salvage continued in the strait.","oxTr":"Yasal korumalara rağmen boğazda yasa dışı kurtarma çalışmaları sürdü.","note":"resmi dil; ismin ardından da gelebilir","n":0,"ex":[],"parts":{"p":[["not","değil"],["with","karşı"],["standing","durmak"]],"lit":"karşısında durmamak, engel olmamak → -e rağmen"}},{"w":"On the other hand","tr":"öte yandan, diğer taraftan","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","By contrast"],"pr":1,"ox":"Sonar surveys are fast. [[On the other hand]], they cannot replace direct observation by divers.","oxTr":"Sonar taramaları hızlıdır. Öte yandan dalgıçların doğrudan gözleminin yerini tutamazlar.","note":"çoğu kez 'on the one hand' ile eşleşir","n":1,"ex":[]},{"w":"On the contrary","tr":"aksine, tam tersine","g":"Zıtlık","y":"cümle başı, virgülle","eq":[],"pr":2,"ox":"The wreck is not unimportant. [[On the contrary]], it is a key war grave.","oxTr":"Batık önemsiz değil. Aksine, kilit bir savaş mezarıdır.","note":"önceki ifadeyi reddeder; on the other hand ile karıştırma","n":2,"ex":[]},{"w":"Conversely","tr":"tersine, buna karşılık","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","By contrast"],"pr":2,"ox":"Cold water slows decay; [[conversely]], warm water speeds up corrosion.","oxTr":"Soğuk su çürümeyi yavaşlatır; buna karşılık ılık su paslanmayı hızlandırır.","n":0,"ex":[]},{"w":"In contrast","tr":"buna karşın, aksine","g":"Zıtlık","y":"cümle başı, virgülle","eq":["By contrast","On the other hand","Conversely"],"pr":1,"ox":"The northern site is well documented. [[In contrast]], the southern site has never been surveyed.","oxTr":"Kuzeydeki alan iyi belgelenmiştir. Buna karşın güneydeki alan hiç taranmamıştır.","note":"in contrast to/with + isim = -in aksine","n":0,"ex":[]},{"w":"By contrast","tr":"buna karşın, buna karşılık","g":"Zıtlık","y":"cümle başı, virgülle","eq":["In contrast","On the other hand","Conversely"],"pr":2,"ox":"Steel hulls collapse slowly. [[By contrast]], wooden hulls are quickly destroyed by shipworms.","oxTr":"Çelik gövdeler yavaş çöker. Buna karşılık ahşap gövdeler deniz kurtlarınca hızla yok edilir.","n":11,"ex":[]},{"w":"Unlike","tr":"-in aksine, -den farklı olarak","g":"Zıtlık","y":"+ isim / V-ing","eq":[],"pr":2,"ox":"[[Unlike]] the battleship, the minesweeper sank in very shallow water.","oxTr":"Zırhlının aksine mayın tarama gemisi çok sığ suda battı.","note":"unlike + isim; cümle almaz","n":1,"ex":[]},{"w":"Contrary to","tr":"-in aksine, -e ters olarak","g":"Zıtlık","y":"+ isim","eq":[],"pr":2,"ox":"[[Contrary to]] popular belief, the submarine was not sunk by a mine.","oxTr":"Yaygın inancın aksine denizaltı bir mayınla batırılmadı.","note":"contrary to popular belief kalıbı sık çıkar","n":1,"ex":[]},{"w":"Much as","tr":"her ne kadar ... -se de","g":"Zıtlık","y":"+ cümle","eq":["Although"],"pr":3,"ox":"[[Much as]] I admire the salvage divers, I think the wreck should be left untouched.","oxTr":"Kurtarma dalgıçlarına ne kadar hayran olsam da batığa dokunulmaması gerektiğini düşünüyorum.","note":"much as genelde like, admire gibi fiillerle","n":0,"ex":[]},{"w":"Albeit","tr":"-se de, gerçi","g":"Zıtlık","y":"+ sıfat / zarf / isim öbeği","eq":[],"pr":2,"ox":"The museum reopened, [[albeit]] with a smaller collection.","oxTr":"Müze, daha küçük bir koleksiyonla da olsa yeniden açıldı.","note":"albeit tam cümle almaz: albeit slowly","n":0,"ex":[],"parts":{"p":[["all","tamamen"],["be","olmak"],["it","o"]],"lit":"kelimesi kelimesine: tamamen öyle olsa da → -se de, gerçi"}},{"w":"Regardless of","tr":"-e bakmaksızın, -den bağımsız olarak","g":"Zıtlık","y":"+ isim / V-ing","eq":["Irrespective of"],"pr":1,"ox":"All war graves must be protected [[regardless of]] the nationality of the sailors.","oxTr":"Denizcilerin uyruğuna bakılmaksızın tüm savaş mezarları korunmalıdır.","note":"regardless (tek başına) = yine de, her şeye rağmen","n":1,"ex":[]},{"w":"All the same","tr":"yine de, her şeye rağmen","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Still","Even so"],"pr":3,"ox":"The dive was risky. [[All the same]], the team decided to go ahead.","oxTr":"Dalış riskliydi. Yine de ekip devam etmeye karar verdi.","note":"cümle sonunda da kullanılır","n":0,"ex":[]},{"w":"Even so","tr":"öyle olsa bile, yine de","g":"Zıtlık","y":"cümle başı, virgülle","eq":["Still","All the same","Nevertheless"],"pr":2,"ox":"The records are incomplete. [[Even so]], they reveal much about the battle.","oxTr":"Kayıtlar eksik. Öyle olsa bile savaş hakkında çok şey ortaya koyuyorlar.","n":0,"ex":[]},{"w":"Because","tr":"çünkü, -dığı için","g":"Neden","y":"+ cümle","eq":["Since","As","Due to the fact that"],"pr":1,"ox":"The site is protected [[because]] it contains the remains of sailors.","oxTr":"Alan, denizcilerin kalıntılarını barındırdığı için koruma altındadır.","note":"because + cümle, because of + isim","n":6,"ex":[]},{"w":"Since","tr":"-dığı için, madem ki","g":"Neden","y":"+ cümle","eq":["Because","As"],"pr":1,"ox":"[[Since]] the wreck is a war grave, diving on it requires a permit.","oxTr":"Batık bir savaş mezarı olduğu için üzerinde dalış izin gerektirir.","note":"since hem 'çünkü' hem '-den beri' anlamına gelir","k":"Since · Neden","n":0,"ex":[]},{"w":"As","tr":"-dığı için, çünkü","g":"Neden","y":"+ cümle","eq":["Because","Since"],"pr":1,"ox":"[[As]] the weather was worsening, the divers returned to the boat.","oxTr":"Hava kötüleştiği için dalgıçlar tekneye döndü.","note":"as: çünkü, -irken, gibi, -dıkça anlamları var","k":"As · Neden","n":0,"ex":[]},{"w":"Now that","tr":"madem ki, artık ...-dığına göre","g":"Neden","y":"+ cümle","eq":["Seeing that"],"pr":2,"ox":"[[Now that]] the archives are digitised, researchers can study them from anywhere.","oxTr":"Arşivler artık dijitalleştirildiğine göre araştırmacılar onları her yerden inceleyebilir.","note":"hem zaman hem neden anlamı taşır","n":0,"ex":[]},{"w":"In that","tr":"-dığı için, -mesi bakımından","g":"Neden","y":"+ cümle","eq":[],"pr":3,"ox":"The discovery is unique [[in that]] the ship's cargo is still on board.","oxTr":"Keşif, geminin yükünün hâlâ gemide olması bakımından eşsizdir.","note":"in that = because; ifadeyi açıklar","n":2,"ex":[]},{"w":"Due to the fact that","tr":"-dığı gerçeğinden dolayı, -dığı için","g":"Neden","y":"+ cümle","eq":["Because","Since","As"],"pr":2,"ox":"The dive was cancelled [[due to the fact that]] visibility was close to zero.","oxTr":"Görüş sıfıra yakın olduğu için dalış iptal edildi.","n":0,"ex":[]},{"w":"Because of","tr":"-den dolayı, yüzünden","g":"Neden","y":"+ isim / V-ing","eq":["Due to","Owing to","On account of"],"pr":1,"ox":"The excavation was delayed [[because of]] bad weather.","oxTr":"Kazı kötü hava yüzünden ertelendi.","note":"because of + isim, because + cümle","n":3,"ex":[]},{"w":"Due to","tr":"-den dolayı, nedeniyle","g":"Neden","y":"+ isim / V-ing","eq":["Because of","Owing to","On account of"],"pr":1,"ox":"Many artefacts were lost [[due to]] illegal diving.","oxTr":"Birçok eser yasa dışı dalış nedeniyle kayboldu.","note":"due to + isim; cümle için due to the fact that","n":0,"ex":[]},{"w":"Owing to","tr":"-den dolayı, nedeniyle","g":"Neden","y":"+ isim / V-ing","eq":["Because of","Due to","On account of"],"pr":2,"ox":"[[Owing to]] its depth, the wreck has escaped looting.","oxTr":"Derinliği nedeniyle batık yağmadan kurtulmuştur.","n":1,"ex":[]},{"w":"On account of","tr":"-den dolayı, yüzünden","g":"Neden","y":"+ isim / V-ing","eq":["Because of","Due to","Owing to"],"pr":2,"ox":"The harbour was closed [[on account of]] unexploded mines.","oxTr":"Liman patlamamış mayınlar yüzünden kapatıldı.","n":0,"ex":[]},{"w":"Thanks to","tr":"sayesinde","g":"Neden","y":"+ isim / V-ing","eq":[],"pr":2,"ox":"[[Thanks to]] new sonar technology, the lost submarine was finally found.","oxTr":"Yeni sonar teknolojisi sayesinde kayıp denizaltı nihayet bulundu.","note":"genelde olumlu sonuç bildirir: 'sayesinde'","n":0,"ex":[]},{"w":"As a result of","tr":"-in sonucu olarak, yüzünden","g":"Neden","y":"+ isim / V-ing","eq":["Because of","Due to","Owing to"],"pr":1,"ox":"The hull broke in two [[as a result of]] a torpedo strike.","oxTr":"Gövde bir torpido isabetinin sonucu olarak ikiye ayrıldı.","note":"as a result (virgüllü) = sonuç olarak","n":1,"ex":[]},{"w":"In view of","tr":"-i göz önünde bulundurarak, -den dolayı","g":"Neden","y":"+ isim","eq":[],"pr":3,"ox":"[[In view of]] the site's historical value, diving was banned.","oxTr":"Alanın tarihi değeri göz önünde bulundurularak dalış yasaklandı.","note":"in view of the fact that + cümle","n":0,"ex":[]},{"w":"Seeing that","tr":"-dığına göre, madem ki","g":"Neden","y":"+ cümle","eq":["Now that","Given that"],"pr":3,"ox":"[[Seeing that]] the wreck is so fragile, it should not be raised.","oxTr":"Batık bu kadar kırılgan olduğuna göre yüzeye çıkarılmamalıdır.","n":0,"ex":[]},{"w":"Given that","tr":"-dığı göz önüne alınırsa, -dığına göre","g":"Neden","y":"+ cümle","eq":["Seeing that"],"pr":2,"ox":"[[Given that]] the logbook survived, we know the ship's final course.","oxTr":"Seyir defteri kurtulduğuna göre geminin son rotasını biliyoruz.","note":"given + isim de olur: given its age","n":0,"ex":[]},{"w":"So","tr":"bu yüzden, bu nedenle","g":"Sonuç","y":"+ cümle","eq":[],"pr":2,"ox":"The water was too murky, [[so]] the divers postponed the survey.","oxTr":"Su çok bulanıktı, bu yüzden dalgıçlar taramayı erteledi.","note":"virgülden sonra cümle; so + sıfat + that = o kadar ... ki","n":14,"ex":[]},{"w":"Therefore","tr":"bu nedenle, bu yüzden","g":"Sonuç","y":"cümle başı, virgülle","eq":["Thus","Hence","Consequently","As a result","Accordingly","As a consequence","For this reason"],"pr":1,"ox":"The wreck is a war grave; [[therefore]], removing objects from it is illegal.","oxTr":"Batık bir savaş mezarıdır; bu nedenle ondan nesne çıkarmak yasa dışıdır.","n":13,"ex":[],"parts":{"p":[["there","orada, o"],["fore","(eski) için"]],"lit":"onun için → bu nedenle, bu yüzden"}},{"w":"Thus","tr":"böylece, bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Hence","Consequently","As a result","Accordingly"],"pr":1,"ox":"The minefield blocked the strait. [[Thus]], the Allied fleet could not advance.","oxTr":"Mayın hattı boğazı kapattı. Bu nedenle Müttefik filosu ilerleyemedi.","note":"thus + V-ing = böylece ...-erek","n":4,"ex":[]},{"w":"Hence","tr":"bu nedenle, bundan dolayı","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","Consequently"],"pr":2,"ox":"The ship was built in Glasgow; [[hence]], its plates bear Scottish markings.","oxTr":"Gemi Glasgow'da inşa edildi; bu nedenle saclarında İskoç damgaları var.","note":"hence + isim de alır: hence the name","n":0,"ex":[]},{"w":"Consequently","tr":"sonuç olarak, bu nedenle","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Thus","As a result","As a consequence"],"pr":1,"ox":"The archives were never catalogued. [[Consequently]], many documents remain unknown.","oxTr":"Arşivler hiç kataloglanmadı. Sonuç olarak birçok belge hâlâ bilinmiyor.","n":0,"ex":[]},{"w":"As a result","tr":"sonuç olarak","g":"Sonuç","y":"cümle başı, virgülle","eq":["Therefore","Consequently","As a consequence"],"pr":1,"ox":"Trawlers damaged the site. [[As a result]], the area was declared a protected zone.","oxTr":"Trol tekneleri alana zarar verdi. Sonuç olarak bölge koruma alanı ilan edildi.","note":"as a result of + isim = -in sonucu olarak","n":5,"ex":[]},{"w":"Accordingly","tr":"buna göre, bu nedenle ul","y":"+ cümle","eq":["Providing","As long as","So long as","On condition that"],"pr":1,"ox":"Visitors may dive on the wreck [[provided that]] they do not touch anything.","oxTr":"Ziyaretçiler hiçbir şeye dokunmamak şartıyla batığa dalabilir.","note":"'provided' tek başına da aynı anlamda","n":0,"ex":[]},{"w":"Providing","tr":"-mek şartıyla","g":"Koşul","y":"+ cümle","eq":["Provided that","As long as","So long as","On condition that"],"pr":2,"ox":"[[Providing]] the weather holds, the survey will begin tomorrow.","oxTr":"Hava böyle giderse tarama yarın başlayacak.","note":"providing (that) = provided (that)","n":0,"ex":[]},{"w":"As long as","tr":"-dığı sürece, -mek şartıyla","g":"Koşul","y":"+ cümle","eq":["So long as","Provided that","Providing","On condition that"],"pr":1,"ox":"The wreck will survive [[as long as]] it remains undisturbed.","oxTr":"Batık rahatsız edilmediği sürece varlığını sürdürecek.","n":1,"ex":[]},{"w":"So long as","tr":"-dığı sürece, -mek şartıyla","g":"Koşul","y":"+ cümle","eq":["As long as","Provided that","Providing","On condition that"],"pr":2,"ox":"Researchers may use the archive [[so long as]] they cite it properly.","oxTr":"Araştırmacılar düzgün kaynak gösterdikleri sürece arşivi kullanabilir.","n":0,"ex":[]},{"w":"On condition that","tr":"-mek şartıyla","g":"Koşul","y":"+ cümle","eq":["Provided that","Providing","As long as","So long as"],"pr":2,"ox":"The museum lent the bell [[on condition that]] it be returned within a year.","oxTr":"Müze, bir yıl içinde iade edilmesi şartıyla çanı ödünç verdi.","n":0,"ex":[]},{"w":"Only if","tr":"ancak ... -se","g":"Koşul","y":"+ cümle","eq":[],"pr":2,"ox":"Artefacts may be raised [[only if]] they are at risk of destruction.","oxTr":"Eserler ancak yok olma tehlikesi taşıyorlarsa çıkarılabilir.","note":"cümle başında devrik yapı: Only if ... will S V1","n":0,"ex":[]},{"w":"In case","tr":"-e karşı, ihtimaline karşı","g":"Koşul","y":"+ cümle","eq":[],"pr":1,"ox":"The divers carried extra air [[in case fficient az kaynakla görür. sufficient yeter, deficient eksik kalır."},{"ws":["Credible","Creditable","Incredible"],"en":"The [[credible]] logbook told a [[creditable]] but almost [[incredible]] story.","tr":"Güvenilir seyir defteri takdire değer ama neredeyse inanılmaz bir hikâye anlattı.","ip":"Hepsi 'inanmak' kökünden (kredi): inanılır, takdiri hak eden, inanılmaz."},{"ws":["Ensure","Insure","Unsure"],"en":"[[Unsure]] of the weather, the owner chose to [[insure]] the ship to [[ensure]] peace of mind.","tr":"Havadan emin olmayan sahip, içi rahat etsin diye gemiyi sigortalattı.","ip":"ensure garantiye almak, insure sigortalamak, unsure emin değil."},{"ws":["Emit","Omit","Permit"],"en":"The wreck may [[emit]] oil; do not [[omit]] it from the report or [[permit]] divers near it.","tr":"Batık petrol salabilir; bunu rapordan atlama ve dalgıçların yaklaşmasına izin verme.","ip":"Kök mit- 'göndermek': e- dışarı (emisyon), o- atlamak, per- geçişe izin."},{"ws":["Explicit","Implicit","Illicit"],"en":"The law is [[explicit]], the warning [[implicit]]: diving on war graves without a permit is [[illicit]].","tr":"Yasa açık, uyarı örtük: izinsiz savaş mezarlarına dalmak yasa dışıdır.","ip":"ex-plicit dışa açılmış, im-plicit içe katlanmış, il-licit izin dışı."},{"ws":["Confirm","Conform to"],"en":"The archive [[confirms]] the date, and the position [[conforms to]] the old chart.","tr":"Arşiv tarihi doğruluyor, konum da eski haritaya uyuyor.","ip":"confirm onaylamak (konfirme), conform to kalıba (form) uymak."},{"ws":["Adverse","Diverse","Advise","Devise"],"en":"In [[adverse]] weather, [[diverse]] teams [[advise]] each other and [[devise]] a new plan.","tr":"Ters havada farklı ekipler birbirine öğüt verir ve yeni bir plan tasarlar.","ip":"ad-verse ters yöne dönmüş, di-verse farklı yönlere. advise öğüt ver, devise tasarla."},{"ws":["Persistent","Existing","Non-existing"],"en":"[[Persistent]] divers search the [[existing]] records for a [[non-existing]] wreck.","tr":"Israrcı dalgıçlar var olan kayıtlarda var olmayan bir batığı arar.","ip":"per-sist sonuna kadar durmak, ex-ist ortaya çıkıp var olmak."},{"ws":["Successive","Successful","Succeed"],"en":"After three [[successive]] storms, the [[successful]] team finally [[succeeded]].","tr":"Art arda üç fırtınadan sonra başarılı ekip sonunda başardı.","ip":"succeed 'arkasından gelmek' de demek: successive art arda, successful başarılı."},{"ws":["Versatile","Infertile","Futile","Fertile"],"en":"A [[versatile]] diver knows a search on [[infertile]] sand is [[futile]]; life hides in the [[fertile]] reef.","tr":"Çok yönlü bir dalgıç kısır kumda aramanın boşuna olduğunu bilir; hayat verimli resifte saklanır.","ip":"fertile verimli, in-fertile kısır; futile boşuna; versatile çok yönlü."},{"ws":["Impartial","Imperious","Imperial","Imperative"],"en":"An [[impartial]] judge, not an [[imperious]] [[imperial]] admiral, should decide; that is [[imperative]].","tr":"Buyurgan bir imparatorluk amirali değil, tarafsız bir yargıç karar vermeli; bu şart.","ip":"im-partial taraf tutmayan. imperial imparatorluk, imperious buyurgan, imperative zorunlu (emir kipi)."},{"ws":["Previous","Perilous","Precious"],"en":"The [[previous]] dive was [[perilous]], but the [[precious]] bell was saved.","tr":"Önceki dalış tehlikeliydi ama değerli çan kurtarıldı.","ip":"pre-vious önceki, peril-ous tehlikeli, preci-ous değerli (price ile akraba)."},{"ws":["Prevailing","Prevail","Prevalent"],"en":"When the [[prevailing]] wind [[prevails]], rust becomes [[prevalent]] on every deck.","tr":"Hâkim rüzgâr baskın çıkınca pas her güvertede yaygınlaşır.","ip":"Üçü de 'üstün gelmek' kökünden: hâkim, baskın çıkmak, yaygın."},{"ws":["Interrupt","Interfere","Interim","Intervene"],"en":"Storms [[interrupt]] the dive, currents [[interfere]], and the [[interim]] director must [[intervene]].","tr":"Fırtınalar dalışı böler, akıntılar işe karışır, geçici müdür müdahale etmek zorunda kalır.","ip":"inter- 'arasında': araya girip kesmek, karışmak, ara dönem, araya girmek."},{"ws":["Undergo","Undermine","Undertake","Understand"],"en":"The hull [[undergoes]] storms that [[undermine]] it; we [[undertake]] a survey to [[understand]] why.","tr":"Gövde onu baltalayan fırtınalar geçiriyor; nedenini anlamak için bir araştırma üstleniyoruz.","ip":"under- 'altında': altından geçmek (yaşamak), altını oymak, altına girmek (üstlenmek)."},{"ws":["Collect","Recollect","Collective"],"en":"We [[collect]] letters so the village can [[recollect]] its [[collective]] memory.","tr":"Köy ortak belleğini hatırlasın diye mektupları topluyoruz.","ip":"collect toplamak (koleksiyon); re-collect anıları yeniden toplamak = hatırlamak."},{"ws":["Discover","Disclose","Dispose"],"en":"Divers [[discover]] the wreck, archives [[disclose]] its name, and nobody may [[dispose]] of its remains.","tr":"Dalgıçlar batığı keşfeder, arşivler adını açıklar, kimse kalıntılarını elden çıkaramaz.","ip":"dis- 'ayırmak': örtüyü kaldırmak, kapağı açmak, kenara koymak."},{"ws":["Reveal","Real","Repeal"],"en":"Sonar will [[reveal]] the [[real]] hull, and the court may [[repeal]] the old salvage law.","tr":"Sonar gerçek gövdeyi ortaya çıkaracak, mahkeme de eski kurtarma yasasını kaldırabilir.","ip":"reveal perdeyi kaldırmak, repeal yasayı geri çağırmak (iptal)."},{"ws":["Assume","Assure"],"en":"Do not [[assume]] the wreck is safe; [[assure]] me you checked the depth.","tr":"Batığın güvenli olduğunu varsayma; derinliği kontrol ettiğine dair bana güvence ver.","ip":"assume varsaymak, assure güvence vermek (sure 'emin')."},{"ws":["Merge","Emerge"],"en":"Two currents [[merge]], and the bow [[emerges]] from the sand.","tr":"İki akıntı birleşir ve pruva kumdan ortaya çıkar.","ip":"merge birleşmek; e-merge 'dalgadan dışarı': ortaya çıkmak."},{"ws":["Feel","Flee","Fuel"],"en":"Sailors [[feel]] the heat and [[flee]] the deck as burning oil [[fuels]] the fire.","tr":"Yanan yağ ateşi körüklerken denizciler sıcağı hisseder ve güverteden kaçar.","ip":"feel hissetmek, flee kaçmak, fuel yakıt; fiil olarak körüklemek."},{"ws":["Foresee","Freeze"],"en":"No one could [[foresee]] the night the strait would [[freeze]].","tr":"Boğazın donacağı geceyi kimse öngöremedi.","ip":"fore-see önceden görmek."},{"ws":["Dire","Fire","Hire","Hide"],"en":"In [[dire]] times the company would [[fire]] old sailors, [[hire]] new ones and [[hide]] the losses.","tr":"Zor zamanlarda şirket eski denizcileri kovar, yenilerini işe alır ve kayıpları saklardı.","ip":"fire kovmak, hire işe almak: biri kapıdan çıkarır, öteki içeri alır."},{"ws":["Propose","Oppose","Suppose","Pose"],"en":"I [[propose]] a dive; you [[oppose]] it, [[suppose]] the worst and say the current [[poses]] a risk.","tr":"Ben dalış öneriyorum; sen karşı çıkıyorsun, en kötüsünü varsayıyorsun ve akıntının risk yarattığını söylüyorsun.","ip":"-pose 'koymak': pro- öne, op- karşıya, sup- altına (varsayım)."},{"ws":["Respect","Reject","Project"],"en":"The board [[respects]] the divers but [[rejects]] the plan they [[projected]].","tr":"Kurul dalgıçlara saygı duyuyor ama tasarladıkları planı reddediyor.","ip":"-ject 'atmak': re- geri atmak (reddetmek), pro- ileri atmak (projelendirmek)."},{"ws":["Deduce from","Reduce","Produce"],"en":"We [[deduce]] from the logs that salt [[reduces]] the steel and [[produces]] holes.","tr":"Seyir defterlerinden tuzun çeliği azalttığı ve delikler açtığı sonucunu çıkarıyoruz.","ip":"-duce 'götürmek': de- sonuç çıkarmak, re- geri götürmek (azaltmak), pro- ileri getirmek (üretmek)."},{"ws":["Indicate","Mitigate","Initiate","Motivate"],"en":"Rising rust may [[indicate]] collapse; to [[mitigate]] it, [[initiate]] a plan and [[motivate]] the team.","tr":"Artan pas çöküşe işaret edebilir; bunu hafifletmek için bir plan başlat ve ekibi motive et.","ip":"Dördü de -ate ile fiil olmuş: göstermek, hafifletmek, başlatmak, güdülemek."},{"ws":["Legitimate","Estimate","Stimulate","Ultimate"],"en":"A [[legitimate]] [[estimate]] can [[stimulate]] research, but the [[ultimate]] answer lies on the seabed.","tr":"Meşru bir tahmin araştırmayı canlandırabilir ama nihai cevap deniz tabanında yatar.","ip":"ultimate en son (ültimatom), stimulate uyarmak (stimülan)."},{"ws":["Determine","Eliminate","Terminate"],"en":"Divers [[determine]] the risk, [[eliminate]] the doubt and [[terminate]] the dive on time.","tr":"Dalgıçlar riski belirler, şüpheyi ortadan kaldırır ve dalışı zamanında bitirir.","ip":"term- 'sınır' (terminal): sınırını koymak, sona erdirmek. e-liminate eşikten dışarı atmak."},{"ws":["Contrary","Contemporary","Temporary"],"en":"[[Contrary]] to [[contemporary]] belief, the ban was only [[temporary]].","tr":"Bugünkü inancın aksine yasak yalnızca geçiciydi.","ip":"tempus 'zaman': temporary geçici, con-temporary aynı zamanın (çağdaş). contrary kontra."},{"ws":["Conventional","Convenient","Intentional"],"en":"The [[conventional]] route was [[convenient]], so the detour was [[intentional]].","tr":"Geleneksel rota elverişliydi, yani sapma kasıtlıydı.","ip":"convention gelenek (konvansiyonel), convenient elverişli, intention niyet."},{"ws":["Consider","Consist of","Considerable","Consistent"],"en":"[[Consider]] this: the site [[consists of]] a [[considerable]] hull, and every report is [[consistent]].","tr":"Şunu düşün: alan hatırı sayılır bir gövdeden oluşuyor ve her rapor tutarlı.","ip":"considerable 'üzerinde düşünülecek kadar' = hatırı sayılır; consistent kendi içinde tutarlı."},{"ws":["Conscious","Concise"],"en":"Be [[conscious]] of the time and keep your dive report [[concise]].","tr":"Zamanın farkında ol ve dalış raporunu kısa ve öz tut.","ip":"conscious bilinçli (science), concise kesilip kısaltılmış."},{"ws":["Complex","Complicated","Compel","Comply with","Complete"],"en":"A [[complex]] wreck and [[complicated]] laws [[compel]] us to [[comply with]] every rule before we [[complete]] the dive.","tr":"Karmaşık bir batık ve çetrefil yasalar, dalışı bitirmeden her kurala uymaya bizi zorlar.","ip":"Hepsi com- ile: compel zorlamak, comply with uymak, complete tamamlamak."},{"ws":["Apprehensive","Comprehend","Comprehensive","Comprise"],"en":"[[Apprehensive]] students [[comprehend]] the [[comprehensive]] report, which [[comprises]] ten chapters.","tr":"Tedirgin öğrenciler on bölümden oluşan kapsamlı raporu kavrar.","ip":"prehend 'kavramak': com- tümüyle kavramak, ap- kötüyü önceden sezmek (tedirgin)."},{"ws":["Proficient","Probable","Profitable"],"en":"A [[proficient]] salvor thought it [[probable]] that the wreck was [[profitable]].","tr":"Yetkin bir kurtarmacı batığın kârlı olmasını muhtemel buldu.","ip":"proficient yetkin, probable muhtemel (prova ile akraba), profitable kârlı."},{"ws":["Prominent","Promise","Promising"],"en":"The [[prominent]] professor [[promised]] a [[promising]] dive.","tr":"Önde gelen profesör ümit verici bir dalış sözü verdi.","ip":"promise söz vermek; promising söz veren = ümit vaat eden."},{"ws":["Prompt","Promote","Proximate","Remote"],"en":"A [[prompt]] reply may [[promote]] the dive to the [[proximate]] wreck, not the [[remote]] one.","tr":"Hızlı bir yanıt, uzaktakine değil en yakın batığa dalışı öne çıkarabilir.","ip":"proximate en yakın (proksimal), remote uzak (uzaktan kumanda)."},{"ws":["Invalid","Invaluable","Valid","Valuable","Available"],"en":"An [[invalid]] permit wastes even [[invaluable]] data; a [[valid]] one makes [[valuable]] records [[available]].","tr":"Geçersiz bir izin en paha biçilmez veriyi bile boşa çıkarır; geçerli bir izin değerli kayıtları kullanılabilir kılar.","ip":"Tuzak: invaluable 'değersiz' değil, değeri biçilemeyecek kadar değerli."},{"ws":["Negligible","Eligible","Reliable","Liable"],"en":"The damage is [[negligible]], the diver [[eligible]], the gear [[reliable]] and the owner [[liable]].","tr":"Hasar önemsiz, dalgıç uygun, ekipman güvenilir, sahibi de sorumlu.","ip":"negligible ihmal edilebilir; liable hukuken sorumlu."},{"ws":["Visible","Viable","Inevitable"],"en":"If the hull is [[visible]], a dive is [[viable]] and discovery is [[inevitable]].","tr":"Gövde görünürse dalış yapılabilir ve keşif kaçınılmazdır.","ip":"visible görünür (vizyon), viable yaşayabilir/uygulanabilir (vita), inevitable kaçınılmaz."},{"ws":["Virtual","Vital"],"en":"A [[virtual]] model is [[vital]] when the real wreck is too deep.","tr":"Gerçek batık çok derindeyse sanal bir model hayati önemdedir.","ip":"virtual sanal (virtüel), vital hayati (vitamin)."},{"ws":["Distant","Distinguished","Instant","Distinct","Distinctive"],"en":"From a [[distant]] boat the [[distinguished]] captain made an [[instant]] call: two [[distinct]] wrecks, each with a [[distinctive]] funnel.","tr":"Seçkin kaptan uzaktaki bir tekneden hemen karar verdi: her biri kendine özgü bacası olan iki ayrı batık.","ip":"distinct ayrı, distinctive ayırt edici, distinguished seçkin."},{"ws":["Confusing","Confused","Puzzling","Puzzled","Perplexing","Perplexed"],"en":"The [[confusing]] chart left us [[confused]], the [[puzzling]] signal [[puzzled]], the [[perplexing]] silence [[perplexed]].","tr":"Kafa karıştırıcı harita kafamızı karıştırdı, şaşırtıcı sinyal şaşırttı, akıl almaz sessizlik afallattı.","ip":"-ing etkiyi veren şey, -ed etkiyi yaşayan kişi: confusing chart, confused diver."},{"ws":["Disappointing","Frustrating","Disappointed","Frustrated","Worried","Worrisome"],"en":"A [[disappointing]] dive and a [[frustrating]] storm left the [[disappointed]], [[frustrated]] crew [[worried]] by a [[worrisome]] forecast.","tr":"Hayal kırıklığı yaratan bir dalış ve sinir bozucu bir fırtına, kırgın ve sinirli mürettebatı endişe verici bir tahminle endişelendirdi.","ip":"Yine aynı kural: -ing / -some veren, -ed hisseden."},{"ws":["Fictional","Fictitious"],"en":"The ghost ship is [[fictional]]; the captain's [[fictitious]] name was a lie.","tr":"Hayalet gemi kurgusal; kaptanın uydurma adı ise bir yalandı.","ip":"fictional romandaki gibi kurgu; fictitious uydurma, sahte."},{"ws":["Imaginative","Imaginary"],"en":"An [[imaginative]] writer drew an [[imaginary]] island.","tr":"Hayal gücü kuvvetli bir yazar hayali bir ada çizdi.","ip":"-ive kişinin özelliği (yaratıcı), -ary şeyin kendisi (hayali)."},{"ws":["Objective","Subjective"],"en":"Sonar data are [[objective]]; sailors' memories are [[subjective]].","tr":"Sonar verisi nesneldir; denizcilerin anıları özneldir.","ip":"ob- karşıda duran nesne, sub- alttaki özne."},{"ws":["Shallow","Allow","Hollow"],"en":"The [[shallow]] bay does not [[allow]] big ships, so the [[hollow]] hull lies near the shore.","tr":"Sığ koy büyük gemilere izin vermez, bu yüzden içi boş gövde kıyıya yakın yatar.","ip":"shallow sığ, hollow içi boş: ikisi de -llow ama anlamları ayrı."},{"ws":["Keep","Steep","Deep"],"en":"[[Keep]] the line tight on the [[steep]] slope; the sea is [[deep]].","tr":"Dik yamaçta ipi gergin tut; deniz derin.","ip":"steep dik (ayrıca 'aşırı': steep price)."},{"ws":["Swift","Shift"],"en":"A [[swift]] current can [[shift]] the sand in a single night.","tr":"Hızlı bir akıntı kumu tek gecede yerinden oynatabilir.","ip":"swift hızlı; shift yer değiştirmek (vardiya da shift)."},{"ws":["Claim","Climb"],"en":"They [[claim]] they can [[climb]] the broken mast.","tr":"Kırık direğe tırmanabileceklerini iddia ediyorlar.","ip":"climb'daki b okunmaz: /klaym/."},{"ws":["Concerned","Conceal","Cancel"],"en":"The [[concerned]] navy chose to [[conceal]] the loss and [[cancel]] the report.","tr":"Endişeli donanma kaybı gizlemeyi ve raporu iptal etmeyi seçti.","ip":"conceal gizlemek, cancel iptal etmek (kansel)."},{"ws":["Abolish","Establish"],"en":"They [[abolished]] the old rule and [[established]] a marine park.","tr":"Eski kuralı kaldırıp bir deniz parkı kurdular.","ip":"Zıt anlamlı ikiz: abolish kaldırmak, establish kurmak."},{"ws":["Strong","Restrain","Strange","Estrange"],"en":"A [[strong]] captain must [[restrain]] a [[strange]] fear, or it will [[estrange]] the crew.","tr":"Güçlü bir kaptan tuhaf bir korkuyu frenlemeli, yoksa korku mürettebatı ondan soğutur.","ip":"strange yabancı/tuhaf, e-strange yabancılaştırmak; restrain dizginlemek."},{"ws":["Verify","Certify","Ratify"],"en":"Experts [[verify]] the data, the institute [[certifies]] it and parliament [[ratifies]] the treaty.","tr":"Uzmanlar veriyi doğrular, enstitü belgeyle onaylar, meclis antlaşmayı onaylar.","ip":"verify doğru mu bak, certify sertifikayla onayla, ratify resmen onayla."},{"ws":["Classify","Clarify"],"en":"First [[classify]] the wrecks, then [[clarify]] the gaps.","tr":"Önce batıkları sınıflandır, sonra boşlukları netleştir.","ip":"class sınıf, clear açık; -ify ile fiil olmuşlar."},{"ws":["Remain","Remind"],"en":"The wrecks [[remain]] to [[remind]] us of the war.","tr":"Batıklar bize savaşı hatırlatmak için yerinde kalır.","ip":"remain kalmak, re-mind 'yeniden akla getirmek'."},{"ws":["Supervise","Survive"],"en":"Those who [[supervise]] the dive help others [[survive]] it.","tr":"Dalışı denetleyenler başkalarının ondan sağ çıkmasına yardım eder.","ip":"super-vise üstten görmek, sur-vive üstünde yaşamak (hayatta kalmak)."},{"ws":["Start","Stare","Store"],"en":"[[Start]] the dive, [[stare]] at the hull and [[store]] every photo.","tr":"Dalışa başla, gövdeye dikkatle bak ve her fotoğrafı sakla.","ip":"stare dik dik bakmak, store depolamak (store = mağaza da)."},{"ws":["Overlooking","Overlook","Overlap"],"en":"From the [[overlooking]] cliff, do not [[overlook]] where two wreck fields [[overlap]].","tr":"Tepeden bakan uçurumdan iki batık alanının örtüştüğü yeri gözden kaçırma.","ip":"Tuzak: overlook hem 'tepeden bakmak' hem 'gözden kaçırmak'."},{"ws":["Surge","Urge","Sue sb for","Urgent"],"en":"After a [[surge]] in looting, the ministry [[urged]] owners to [[sue]] looters for damage; it is [[urgent]].","tr":"Yağmadaki ani artıştan sonra bakanlık sahiplerine yağmacılara dava açmalarını tavsiye etti; konu acil.","ip":"surge ani dalga/artış, urge ısrarla teşvik etmek, urgent acil."},{"ws":["Explore","Exploit"],"en":"Scientists [[explore]] wrecks; looters [[exploit]] them.","tr":"Bilim insanları batıkları keşfeder; yağmacılar sömürür.","ip":"explore keşfetmek, exploit sömürmek (exploitation)."},{"ws":["Expand","Extend","Expend"],"en":"To [[expand]] the survey, we [[extend]] the season and [[expend]] more fuel.","tr":"Araştırmayı genişletmek için sezonu uzatıyor, daha çok yakıt harcıyoruz.","ip":"ex-pand yayılmak, ex-tend uzatmak, ex-pend harcamak (spend ile akraba)."},{"ws":["Extensive","Excessive","Inexpensive"],"en":"An [[extensive]] survey need not be [[excessive]]; sonar is [[inexpensive]].","tr":"Kapsamlı bir araştırmanın aşırı olması gerekmez; sonar ucuzdur.","ip":"excessive aşırı (exceed 'aşmak'), in-expensive pahalı değil."},{"ws":["Humble","Tumble"],"en":"From a [[humble]] boat we watched the giant mast [[tumble]].","tr":"Mütevazı bir tekneden dev direğin devrilişini izledik.","ip":"humble alçakgönüllü, tumble yuvarlanmak."},{"ws":["Numerous","Nervous","Humorous"],"en":"[[Numerous]] [[nervous]] divers laughed at a [[humorous]] joke.","tr":"Sayısız gergin dalgıç esprili bir şakaya güldü.","ip":"numerous sayısız (numara), humorous esprili (humor)."},{"ws":["Ambitious","Ambiguous"],"en":"An [[ambitious]] plan with an [[ambiguous]] map is bound to fail.","tr":"Muğlak bir haritayla hırslı bir plan başarısız olmaya mahkûm.","ip":"ambition hırs (ambisyon); ambi- 'iki yönlü' = muğlak."},{"ws":["Alluring","Charming","Alarming"],"en":"The [[alluring]] wreck is [[charming]], but its depth is [[alarming]].","tr":"Çekici batık büyüleyici ama derinliği kaygı verici.","ip":"alarm = alarming; alluring 'yem (lure) ile çeken'."},{"ws":["Thriving","Striking","Thrilling","Shrinking"],"en":"A [[thriving]] reef on a [[striking]] wreck is a [[thrilling]] sight, but the reef is [[shrinking]].","tr":"Göze çarpan bir batıkta gelişen bir resif heyecan verici bir manzara ama resif küçülüyor.","ip":"thrive gelişmek, thrill heyecanlandırmak, shrink küçülmek."},{"ws":["Weak","Leak","Weaken"],"en":"A [[weak]] plate may [[leak]], and every leak will [[weaken]] the hull.","tr":"Zayıf bir sac su sızdırabilir ve her sızıntı gövdeyi zayıflatır.","ip":"weak + -en = weaken (zayıflatmak)."},{"ws":["Wise","Rise","Wide","Arise"],"en":"A [[wise]] diver knows that when tides [[rise]] in a [[wide]] bay, problems [[arise]].","tr":"Bilge bir dalgıç bilir: geniş bir koyda gelgit yükselince sorunlar çıkar.","ip":"rise yükselmek, arise (sorun) ortaya çıkmak."},{"ws":["Regal","Legal","Illegal","Illegitimate"],"en":"Raising a [[regal]] figurehead is [[legal]] with a permit; without one it is [[illegal]] and the sale [[illegitimate]].","tr":"Soylu bir pruva figürünü çıkarmak izinle yasal; izinsiz yasa dışı, satışı da gayrimeşrudur.","ip":"regal kraliyete ait (rey), legal yasal; il- olumsuz yapar."},{"ws":["Modern","Moderate"],"en":"[[Modern]] gear needs only a [[moderate]] budget.","tr":"Modern ekipman yalnızca makul bir bütçe ister.","ip":"moderate ılımlı, makul (moderatör)."},{"ws":["Plausible","Possible","Implausible","Impossible"],"en":"A [[plausible]] story is [[possible]]; an [[implausible]] one is not always [[impossible]].","tr":"Akla yatkın bir hikâye olasıdır; inandırıcı olmayan biri de her zaman imkânsız değildir.","ip":"plausible akla yatkın, possible olası; im- olumsuz yapar."},{"ws":["Dedicate","Delicate","Deliberate"],"en":"We [[dedicate]] this [[delicate]] work to sailors; any damage was never [[deliberate]].","tr":"Bu narin çalışmayı denizcilere adıyoruz; hiçbir hasar kasıtlı değildi.","ip":"dedicate adamak, delicate narin (delikat), deliberate kasıtlı."},{"ws":["Mighty","Weighty"],"en":"The [[mighty]] battleship carried a [[weighty]] name.","tr":"Güçlü zırhlı ağır bir isim taşıyordu.","ip":"might güç, weight ağırlık; -y sıfat yapar."},{"ws":["Rehearse","Release"],"en":"We [[rehearse]] the lift before we [[release]] the buoy.","tr":"Şamandırayı bırakmadan önce kaldırma işini prova ediyoruz.","ip":"rehearse prova yapmak, release serbest bırakmak."},{"ws":["Ruthless","Fruitless","Guiltless"],"en":"The [[ruthless]] raid was [[fruitless]], and the [[guiltless]] crew paid the price.","tr":"Acımasız baskın sonuçsuz kaldı, bedelini suçsuz mürettebat ödedi.","ip":"-less '-sız': ruth merhamet, fruit meyve, guilt suç."},{"ws":["Decisive","Deceive"],"en":"Mines were [[decisive]]; smoke helped [[deceive]] the gunners.","tr":"Mayınlar belirleyiciydi; duman topçuları kandırmaya yaradı.","ip":"decisive karar (decide) ile ilgili; deceive kandırmak."},{"ws":["Derive from","Deprived of","Drive"],"en":"The bay's name [[derives]] from an old wreck; villagers [[deprived]] of roads still [[drive]] to see it.","tr":"Koyun adı eski bir batıktan gelir; yolsuz kalan köylüler onu görmek için hâlâ araçla gelir.","ip":"derive from türemek, deprived of yoksun bırakılmış."},{"ws":["Long for","Long"],"en":"Sailors [[long for]] home on a [[long]] voyage.","tr":"Denizciler uzun bir yolculukta evlerini özler.","ip":"long sıfat uzun; long for fiil özlemek."},{"ws":["Think","Thick"],"en":"Do not [[think]] a [[thick]] hull is always safe.","tr":"Kalın bir gövdenin her zaman güvenli olduğunu düşünme.","ip":"thick'te n yok: /θık/."},{"ws":["On the brink of","On the verge of","On the edge of","On purpose"],"en":"[[On the brink of]] war, [[on the verge of]] sinking, [[on the edge of]] the minefield, no captain turned back [[on purpose]].","tr":"Savaşın eşiğinde, batmak üzereyken, mayın tarlasının kıyısında hiçbir kaptan bilerek geri dönmedi.","ip":"brink, verge, edge üçü de 'kenar': -mek üzere. on purpose ise kasten."}]};</script>
<script>
// ---------- data ----------
const PRE={a:['a-, an-','değil, -sız'],ab:['ab-','uzak, -den ayrı'],ad:['ad-, ac-, ap-…','-e doğru'],ante:['ante-','önce'],anti:['anti-','karşı'],auto:['auto-','kendi'],bene:['bene-','iyi'],bi:['bi-','iki'],com:['com-, con-, co-','birlikte, tamamen'],contra:['contra-','karşı'],counter:['counter-','karşı'],de:['de-','aşağı, ters, gidermek'],dis:['dis-, di-','değil, ayrı, ters'],en:['en-, em-','-leştirmek, içine koymak'],ex:['ex-, e-','dışarı'],extra:['extra-','ötesinde'],fore:['fore-','önceden'],'in-neg':['in-, im-, il-, ir-','değil'],'in-into':['in-, im- (içine)','içine, üzerine'],inter:['inter-','arasında'],mal:['mal-','kötü'],mis:['mis-','yanlış'],non:['non-','değil'],ob:['ob-, op-','karşı, önünde'],out:['out-','dışarı, -den fazla'],over:['over-','aşırı, üstünde'],per:['per-','baştan sona'],pre:['pre-','önce'],pro:['pro-','ileri, önde'],re:['re-','yeniden, geri'],se:['se-','ayrı'],sub:['sub-, sup-, sus-','alt'],super:['super-','üst, aşırı'],sur:['sur-','üst, öte'],syn:['syn-, sym-','birlikte'],trans:['trans-','öte, karşıya'],un:['un-','değil, tersini yapmak'],under:['under-','altında, yetersiz'],up:['up-','yukarı'],with:['with-','geri, karşı']};
const SUF={able:['-able, -ible','-ebilir'],al:['-al, -ial','-e ait, -sel'],ant:['-ant, -ent','yapan, -en'],ary:['-ary, -ory','-e ait'],ate:['-ate','fiil ya da sıfat yapar'],ed:['-ed','-miş, -lı'],en:['-en','-leştirmek'],ful:['-ful','-lı, dolu'],ic:['-ic, -ical','-sel, -ik'],ing:['-ing','-en, -ıcı'],ish:['-ish','-imsi'],ive:['-ive','-ici, eğilimli'],less:['-less','-sız'],ly:['-ly','-ca, -li'],ous:['-ous, -ious','-lı, dolu'],y:['-y','-lı'],ize:['-ize, -ise','-leştirmek'],ify:['-ify','-leştirmek, yapmak'],ment:['-ment','isim yapar'],ion:['-ion','isim yapar']};
const FN=[
 ['Olumsuz yapanlar','kelimeyi tersine çevirir: aware → unaware, care → careless',[['pre','un'],['pre','in-neg'],['pre','dis'],['pre','non'],['pre','a'],['suf','less']]],
 ['Yanlış, kötü','mislead yanlış yönlendirmek',[['pre','mis'],['pre','mal']]],
 ['Sıfat yapanlar','afford → affordable, danger → dangerous',[['suf','able'],['suf','ful'],['suf','ous'],['suf','ive'],['suf','al'],['suf','ic'],['suf','ant'],['suf','ary'],['suf','y'],['suf','ish'],['suf','ed'],['suf','ing']]],
 ['Fiil yapanlar','weak → weaken, modern → modernize',[['suf','ize'],['suf','ify'],['suf','en'],['suf','ate'],['pre','en']]],
 ['İsim ve zarf yapanlar','develop → development, quick → quickly',[['suf','ment'],['suf','ion'],['suf','ly']]],
 ['Zaman ve sıra','önce, sonra, yeniden',[['pre','pre'],['pre','fore'],['pre','ante'],['pre','re']]],
 ['Yön ve yer','dışarı, içeri, alt, üst, öte',[['pre','ex'],['pre','in-into'],['pre','ab'],['pre','ad'],['pre','de'],['pre','se'],['pre','sub'],['pre','under'],['pre','super'],['pre','sur'],['pre','over'],['pre','out'],['pre','up'],['pre','extra'],['pre','trans'],['pre','inter'],['pre','per'],['pre','pro'],['pre','ob'],['pre','with']]],
 ['Birlik, karşıtlık, sayı','com- birlikte, anti- karşı, bi- iki',[['pre','com'],['pre','syn'],['pre','anti'],['pre','contra'],['pre','counter'],['pre','auto'],['pre','bi'],['pre','bene']]]];
const LT={fa:['Farsça yoluyla ortak kök','birader ile brother gibi'],fr:['Fransızcadan Türkçeye geçmiş kardeşi','Türkçesini biliyorsan anlamını da biliyorsun'],it:['İtalyanca ya da Yunancadan gelen kardeşi',''],en:['İngilizceden Türkçeye geçmiş',''],kok:['Kökü tanıdık bir kelimede',''],yalanci:['Yalancı eş: benziyor ama anlamı farklı','YDS bu tuzağı sever']};
const PP={up:'tamamen, yukarı, artış',out:'dışarı, sonuna kadar',off:'ayrılma, kesme, iptal',down:'azalma, aşağı',in:'içeri, katılma',into:'içine, -e dönüşme',on:'devam, üzerine',upon:'üzerine',over:'baştan sona, devir',away:'uzaklaşma, yok olma',back:'geri',for:'amaç, istek',from:'kaynak',with:'birlikte, başa çıkma',to:'yönelme',through:'baştan sona, atlatma',about:'neden olma, hakkında',after:'peşinden',along:'birlikte',across:'karşıya, rastlama',around:'çevresinde',apart:'parçalara',ahead:'ileri',against:'karşı',by:'-le, yanında',at:'-de, -e',of:'-in',without:'-sız',beyond:'ötesinde',together:'bir arada',forward:'ileri',between:'arasında',towards:'-e doğru','out of':'dışında',under:'altında'};
const CATS=[['bag','Bağlaç'],['konu','Konu'],['verb','Fiil'],['adj','Sıfat'],['np','İsim + edat'],['pv','Phrasal verb']];
const CATN=Object.fromEntries(CATS);
const ALL=[];
DATA.konu=DATA.konu||[];DATA.kg=DATA.kg||[];
for(const [c] of CATS)for(const o of (DATA[c]||[])){o.pos=c;o.key=c+':'+(o.k||o.w);ALL.push(o)}
const BYKEY=Object.fromEntries(ALL.map(o=>[o.key,o]));
const BYW={};ALL.forEach(o=>{(BYW[o.w.toLowerCase()]=BYW[o.w.toLowerCase()]||[]).push(o)});
const TK=DATA.tk||[];
const KONU_ALL=[...new Set(DATA.kg.flatMap(g=>g.items.map(r=>BYKEY[r.k]).filter(Boolean)))];
const LIST=c=>c==='konu'?KONU_ALL:DATA[c];
let LOCKED=typeof ENC!=='undefined'&&ENC;

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exHtml=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
const low=s=>String(s).toLocaleLowerCase('tr');
const today=()=>{const n=new Date();return Math.floor((n-n.getTimezoneOffset()*6e4)/864e5)};
const dayLabel=d=>{const t=new Date(d*864e5);return t.getUTCDate()+'.'+(t.getUTCMonth()+1)};
let toastT=null;function toast(m){const e=$('sync');if(!e)return;e.textContent=m;e.classList.add('flash');clearTimeout(toastT);toastT=setTimeout(()=>{e.classList.remove('flash');e.textContent=syncMsg},2400)}

// ---------- progress state ----------
const LS='yds-progress-v2';
const INT=[0,1,2,4,8,16,32,64];
let S={v:2,c:{},d:{},t:0};
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r&&r.c)S=r}catch(e){}
  try{const old=JSON.parse(localStorage.getItem('yds-learned')||'null');if(old&&!S.migrated){for(const w in old)if(old[w])(BYW[w.toLowerCase()]||[]).forEach(o=>{S.c[o.key]={b:5,due:today()+16,s:1,k:1,l:0,u:Date.now()}});S.migrated=1}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function merge(a,b){const r={v:2,c:{...a.c},d:{...a.d},t:Math.max(a.t||0,b.t||0),migrated:a.migrated||b.migrated,exam:(b.t||0)>(a.t||0)?(b.exam||a.exam):(a.exam||b.exam)};
  for(const k in b.c){if(!r.c[k]||(b.c[k].u||0)>(r.c[k].u||0))r.c[k]=b.c[k]}
  for(const k in b.d){const x=r.d[k]||[0,0,0],y=b.d[k];r.d[k]=[Math.max(x[0],y[0]),Math.max(x[1],y[1]),Math.max(x[2],y[2])]}
  return r}
const box=k=>S.c[k]?.b||0;
const isL=k=>box(k)>=4;
function bump(i,n=1){const t=today();const d=S.d[t]||[0,0,0];d[i]+=n;S.d[t]=d}
function grade(k,r){const c=S.c[k]||{b:0,due:0,s:0,k:0,l:0};const was=c.b>=4;c.s++;
  if(r===0){c.l++;c.b=1;c.due=today()}else if(r===1){c.b=Math.max(1,c.b);c.due=today()+1}else{c.k++;c.b=Math.min(7,c.b+1);c.due=today()+INT[c.b]}
  c.u=Date.now();S.c[k]=c;bump(0);if(r===2)bump(1);if(!was&&c.b>=4)bump(2);changed()}
function setLearned(k,on){const c=S.c[k]||{b:0,due:0,s:0,k:0,l:0};const was=c.b>=4;if(on){c.b=5;c.due=today()+16}else{c.b=0;c.due=0}c.u=Date.now();S.c[k]=c;if(on&&!was)bump(2);changed()}
let saveT=null;
function changed(){S.t=Date.now();saveLocal();clearTimeout(saveT);saveT=setTimeout(pushRemote,1500);updateBadge()}

// ---------- sync (Claude page) ----------
let REMOTE=null,syncMsg=MODE==='pages'?'Bu cihazda kayıtlı':'Bu cihazda kayıtlı';
function setSync(m){syncMsg=m;const e=$('sync');if(e)e.textContent=m}
async function initSync(){
  if(MODE!=='artifact'||!window.claude||!claude.use)return;
  try{const db=await claude.use('db');const user=await claude.use('user');if(!db||!user)return;const id=await user.id();if(!id)return;
    REMOTE=db.doc('data/users/'+id+'/state');setSync('Eşitleniyor…');
    const snap=await REMOTE.get();const r=snap.exists?snap.data():null;
    if(r&&r.s){try{S=merge(S,JSON.parse(r.s));saveLocal()}catch(e){}}
    await pushRemote();
    REMOTE.onSnapshot(sn=>{const x=sn.data&&sn.data();if(!x||!x.s)return;try{const o=JSON.parse(x.s);if((o.t||0)>(S.t||0)){S=merge(S,o);saveLocal();updateBadge();if(cur==='ilerleme')render()}}catch(e){}},()=>setSync('Eşitleme durdu'));
    render();
  }catch(e){setSync('Bu cihazda kayıtlı')}
}
async function pushRemote(){if(!REMOTE)return;try{await REMOTE.set({s:JSON.stringify(S),t:S.t});setSync('Hesabına kaydedildi')}catch(e){setSync('Kaydedilemedi, bu cihazda duruyor')}}

// ---------- thesis sentences (locked on the public site) ----------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw,remember){
  const salt=b64(ENC.salt),iv=b64(ENC.iv),ct=b64(ENC.ct);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const map=JSON.parse(new TextDecoder().decode(pt));
  for(const k in map)if(BYKEY[k])BYKEY[k].ex=map[k];
  LOCKED=false;
  if(remember){try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem('yds-key',btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(e){}}
}
async function unlockSaved(){try{const k=localStorage.getItem('yds-key');if(!k)return;
  const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  const map=JSON.parse(new TextDecoder().decode(pt));for(const k2 in map)if(BYKEY[k2])BYKEY[k2].ex=map[k2];LOCKED=false;render()}catch(e){}}
function unlockSheet(){openSheet(`<h2 style="margin:0 0 6px;font:700 20px var(--display)">Tez cümlelerini aç</h2>

  <form id="uf" style="display:grid;gap:10px;margin-top:10px"><input id="upw" type="password" autocomplete="current-password" placeholder="Parola" style="font:16px var(--body);padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)">
  <p id="uerr" class="fix" hidden>Parola yanlış. Tekrar dene.</p><button class="btn fill">Kilidi aç</button></form>`);
  $('uf').onsubmit=async e=>{e.preventDefault();try{await unlock($('upw').value,true);closeSheet();toast('Tez cümleleri açıldı');render()}catch(er){$('uerr').hidden=false}}}


// ---------- levels ----------
const LV=[[0,'Hiç bilmiyorsun'],[10,'Yeni başladın'],[35,'Yarı yoldasın'],[65,'Çoğunu biliyorsun'],[95,'Hepsini öğrendin']];
function catStat(c){const L=LIST(c),n=L.length,k=L.filter(o=>isL(o.key)).length,s=L.filter(o=>S.c[o.key]?.s).length,h=L.filter(o=>heat(o.key)>0).length,p=n?k/n*100:0;
  let i=0;LV.forEach((x,j)=>{if(p>=x[0])i=j});const nx=LV[i+1];return {n,k,s,h,p,lv:i+1,name:LV[i][1],next:nx?Math.max(1,Math.ceil(nx[0]/100*n)-k):0,nextName:nx?nx[1]:''}}
function heat(k){const c=S.c[k];if(!c||c.b>=4)return 0;return Math.min(3,c.l||0)}
function lvDots(lv){return `<span class="lvd" aria-label="Kademe ${lv} / 5">${[1,2,3,4,5].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</span>`}
function meterStrip(){return `<button class="meters" data-tab="ilerleme" aria-label="İlerlemeni gör">${CATS.map(([c,l])=>{const st=catStat(c);return `<span class="mt"><span class="ml">${l.replace('İsim + edat','İsim+').replace('Phrasal verb','Phrasal')}</span><span class="mb"><i style="width:${st.p}%"></i></span><span class="mv">${lvDots(st.lv)}<span class="mp2">%${Math.round(st.p)}</span></span></span>`}).join('')}</button>`}

// ---------- item renderers ----------
function wDisp(o){if(!o.parts||!o.parts.p)return esc(o.w);let i=0;const cap=o.w[0]===o.w[0].toUpperCase();return o.parts.p.map(([x],j)=>{let t=x;if(j===0&&cap)t=t[0].toUpperCase()+t.slice(1);return esc(t)}).join('<span class="sp">·</span>')}
function partsHtml(o){if(!o.parts||!o.parts.p)return'';return `<div class="parts"><div class="pg">${o.parts.p.map(([x,g])=>`<span class="pc"><b>${esc(x)}</b><small>${esc(g||'—')}</small></span>`).join('<span class="pplus">+</span>')}</div>${o.parts.lit?`<div class="note">${esc(o.parts.lit)}</div>`:''}</div>`}
function dots(k){const b=box(k);if(b>=4)return '<span class="done" aria-label="Öğrenildi">✓</span>';if(!b)return '';return `<span class="dots" aria-label="Kutu ${b}">${[1,2,3].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</span>`}
function rowHtml(o,r){const tr=r?r.tr:o.tr;return `<div class="item${r&&r.warn?' wrn':''}${heat(o.key)?' h'+heat(o.key):''}${isL(o.key)?' lrn':''}" id="it-${esc(o.key)}"><button class="row" data-open="${esc(o.key)}" aria-expanded="false"><span class="rw">${wDisp(o)}</span><span class="rs">${o.n?`<span class="tz">tezde ${o.n}</span>`:''}${dots(o.key)}</span><span class="rt">${r&&r.add?'<b style="color:var(--ok)">eklendi</b> · ':''}${esc(tr)}${o.y?' · '+esc(o.y):''}</span></button>${r&&r.warn?`<div class="fix" style="margin:0 14px 10px">${esc(r.warn)}</div>`:''}</div>`}
function morph(o){if(!o.pre&&!o.suf)return'';const p=[];if(o.pre)p.push(`<span class="mp">${esc(PRE[o.pre][0].split(',')[0])}</span>`);p.push(`<span>${esc(o.root||o.w)}</span>`);if(o.suf)p.push(`<span class="mp">${esc(SUF[o.suf][0].split(',')[0])}</span>`);
