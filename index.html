  const R=ALL.filter(o=>hit(o,q)).sort((a,b)=>rank(a)-rank(b)||a.w.localeCompare(b.w));
  const T=TK.map((t,i)=>[t,i]).filter(([t])=>t.ws.some(w=>w.toLowerCase().includes(q))||t.en.toLowerCase().includes(q)||low(t.tr).includes(q));
  return `<p class="lead">Bütün sözlükte <b>${R.length}</b> sonuç${T.length?`, <b>${T.length}</b> tekerleme`:''}.</p>`+(R.length?`<div class="list">${R.slice(0,limit).map(o=>rowHtml(o).replace('<span class="rw">',`<span class="rw"><span class="bd" style="font-size:11px;vertical-align:3px;margin-right:6px">${CATN[o.pos]}</span>`)).join('')}</div>${R.length>limit?'<button class="btn more" data-more>Daha fazla göster</button>':''}`:'<p class="empty">Bulunamadı. Türkçe anlamla da arayabilirsin.</p>')+T.slice(0,8).map(([t,i])=>tkHtml(t,i)).join('');
}
function render(){
  const q=qv();$('qx').hidden=!q;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===cur?'page':'false'));
  const v=$('view');
  if(studying&&!q){v.innerHTML='<div class="studyv"><div class="sh"><button class="btn" data-endstudy>Bitir</button><div class="pbar"><i id="pfill"></i></div><span class="sn" id="pcount"></span></div><div class="scard" id="scard"></div><div class="sfoot" id="sfoot"></div></div>';setSync(syncMsg);renderMeters();drawStudy();return}
  v.innerHTML=q?vSearch(q):cur==='sozluk'?vSozluk():cur==='kesfet'?vKesfet():cur==='calis'?vCalis():vIlerleme();
  const r=$('restore');if(r)r.onchange=restore;
  const ed=$('examd');if(ed)ed.onchange=()=>{const v=ed.value;if(!v)return;const t=Math.floor(Date.parse(v+'T00:00:00Z')/864e5);if(t>today()){S.exam=t;changed();render()}};
  setSync(syncMsg);renderMeters();
}
function renderMeters(){const m=$('meters');if(m)m.innerHTML=meterStrip()}
function updateBadge(){renderMeters();const n=dueItems().length;const b=$('duebadge');if(b){b.textContent=n;b.hidden=!n}}


// ---------- exam plan ----------
const EXAM_DEFAULT=today()+30;
const examDay=()=>S.exam||EXAM_DEFAULT;
function planStat(){const left=Math.max(1,examDay()-today());const un=ALL.filter(o=>!isL(o.key));const unseen=ALL.filter(o=>!S.c[o.key]?.s);const study=Math.max(1,left-3);
  return {left,un:un.length,unseen:unseen.length,daily:Math.ceil(un.length/study),sweep:Math.ceil(unseen.length/Math.max(1,Math.min(5,left)))}}
const isoDay=d=>new Date(d*864e5).toISOString().slice(0,10);

// ---------- study ----------
let Q=[],qi=0,shown=false,done=0,total=0,again=new Set(),studying=false,smode='srs';
function startSweep(){smode='tara';let pool=ALL.filter(o=>!S.c[o.key]?.s);if(deckCat!=='rec')pool=pool.filter(o=>o.pos===deckCat);else pool.sort((a,b)=>recOrder(a)-recOrder(b));Q=pool.slice(0,50);if(!Q.length){toast('Taranacak kelime kalmadı');return}qi=0;done=0;total=Q.length;again=new Set();shown=false;studying=true;render();window.scrollTo({top:0})}
function sweep(k,know){const c=S.c[k]||{b:0,due:0,s:0,k:0,l:0};const was=c.b>=4;c.s=(c.s||0)+1;if(know){c.b=Math.max(c.b,4);c.due=today()+4;c.k++}else{c.b=1;c.due=today()}c.u=Date.now();S.c[k]=c;if(know&&!was)bump(2);changed()}
function startStudy(){smode='srs';const due=dueItems();const nw=newItems().slice(0,NN());Q=[...due.sort(()=>Math.random()-.5),...nw];if(!Q.length)return;qi=0;done=0;total=Q.length;again=new Set();shown=false;studying=true;render();window.scrollTo({top:0})}
function closeStudy(){studying=false;render();window.scrollTo({top:0})}
function drawStudy(){
  $('pfill').style.width=(done/Math.max(total,1)*100)+'%';$('pcount').textContent=`${done} / ${total}`;
  if(qi>=Q.length){$('scard').innerHTML=smode==='tara'?`<div class="big">Tarama bitti</div><p class="hint">${done} kelime taradın. Bildiklerin öğrenildi sayıldı, 4 gün sonra bir kez daha sorulacak. Bilmediklerin bugünkü çalışmaya eklendi.</p>`:`<div class="big">Bitti</div><p class="hint">${done} kart çalıştın. Bugünkü tekrar: ${(S.d[today()]||[0])[0]}.</p>`;$('sfoot').innerHTML='<button class="btn fill reveal" id="sdone">Kapat</button>';$('sdone').onclick=closeStudy;return}
  const o=Q[qi];
  if(smode==='tara'){$('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span><span class="bd y">Hızlı tarama</span></div><div class="big">${esc(o.w)}</div>${shown?`<div class="ans">${esc(o.tr)}</div>${o.y?`<p class="hint">${esc(o.y)}</p>`:''}`:'<p class="hint">Anlamını biliyor musun? Emin değilsen “Anlamı” ile bak.</p>'}`;
    $('sfoot').innerHTML=`${shown?'':'<button class="btn" id="sshow">Anlamı</button>'}<div class="answers" style="grid-template-columns:1fr 1fr"><button class="a0" data-sw="0">Bilmiyorum<small>çalışma listesine</small></button><button class="a2" data-sw="1">Biliyorum<small>4 gün sonra kontrol</small></button></div>`;
    if(!shown)$('sshow').onclick=()=>{shown=true;drawStudy()};return}
  const cz=front==='cloze'&&o.ex&&o.ex.length?o.ex[qi%o.ex.length]:null;
  if(cz&&!shown){$('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span><span class="bd y">Tezinden</span></div><p class="ex" style="font-size:19px">${esc(cz).replace(/\[\[(.+?)\]\]/g,'<b style="letter-spacing:.1em">_____</b>')}</p><p class="hint">Boşluğa hangi kelime gelir?</p>`;$('sfoot').innerHTML='<button class="btn fill reveal" id="sshow">Göster</button>';$('sshow').onclick=()=>{shown=true;drawStudy()};return}
  $('scard').innerHTML=`<div class="badges" style="justify-content:center"><span class="bd">${CATN[o.pos]}</span>${o.y&&shown?`<span class="bd y">${esc(o.y)}</span>`:''}</div><div class="big">${wDisp(o)}</div>`+(cz?`<p class="ex">${exHtml(cz)}</p>`:'')+(shown?`<div class="ans">${esc(o.tr)}</div>${detail(o,false).replace(/<div class="acts">[\s\S]*?<\/div><\/div>$/,'</div>').replace('<div class="badges">','<div class="badges" hidden>')}`:'<p class="hint">Anlamını düşün, sonra göster.</p>');
  $('sfoot').innerHTML=shown?`<div class="answers"><button class="a0" data-g="0">Bilmiyorum<small>bugün yine</small></button><button class="a1" data-g="1">Zor<small>yarın</small></button><button class="a2" data-g="2">Biliyorum<small>${INT[Math.min(7,box(o.key)+1)]} gün sonra</small></button></div>`:'<button class="btn fill reveal" id="sshow">Göster</button>';
  if(!shown)$('sshow').onclick=()=>{shown=true;drawStudy()};
}
function answer(g){const o=Q[qi];grade(o.key,g);if(g===0&&!again.has(o.key)){again.add(o.key);Q.splice(Math.min(Q.length,qi+4),0,o);total++}done++;qi++;shown=false;drawStudy()}

// ---------- sheet ----------
let inlAnchor=null;
function openSheet(html,anchor){closeSheet();const p=document.createElement('section');p.className='panel inl';p.id='inl';p.innerHTML='<button class="x" data-closeinl aria-label="Kapat">×</button>'+html;
  const a=anchor||inlAnchor;if(a&&a.isConnected){a.after(p)}else{$('view').prepend(p)}inlAnchor=a||null;try{p.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}
function closeSheet(){const p=$('inl');if(p)p.remove()}

// ---------- backup ----------
async function backup(){const data=JSON.stringify(S);const name=`yds-ilerleme-${new Date().toISOString().slice(0,10)}.json`;
  try{if(MODE==='artifact'&&window.claude){const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data});return}}}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('İndirme başlatılamadı')}}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.c)throw 0;S=merge(S,o);changed();render();toast('Yedek geri yüklendi')}catch(er){toast('Bu dosya bir yedek değil')}};r.readAsText(f)}

// ---------- events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-sheet]');if(!t)return;const ds=t.dataset;
  if(ds.tab){studying=false;cur=ds.tab;$('q').value='';limit=60;render();window.scrollTo({top:0});return}
  if(ds.cat){cat=ds.cat;limit=60;render();return}
  if(ds.unit){unit=ds.unit;limit=60;render();return}
  if(ds.filt){filt=ds.filt;limit=60;render();return}
  if(ds.kes){kesfet=ds.kes;render();return}
  if(ds.more!==undefined){limit+=80;render();return}
  if(ds.open){const it=t.parentElement;const d=it.querySelector('.det');if(d){d.remove();t.setAttribute('aria-expanded','false')}else{it.insertAdjacentHTML('beforeend',detail(BYKEY[ds.open],false));t.setAttribute('aria-expanded','true')}return}
  if(ds.closeinl!==undefined){closeSheet();return}
  if(ds.sheet){const anc=t.closest('.chips,.pairs')||t;openSheet(detail(BYKEY[ds.sheet],true),anc);return}
  if(ds.learn){const k=ds.learn;setLearned(k,!isL(k));renderMeters();const it=document.getElementById('it-'+k);if(it&&!t.closest('#inl')){it.outerHTML=rowHtml(BYKEY[k]);const n=document.getElementById('it-'+k);n.insertAdjacentHTML('beforeend',detail(BYKEY[k],false));n.querySelector('.row').setAttribute('aria-expanded','true')}else{openSheet(detail(BYKEY[k],true));const r=document.getElementById('it-'+k);if(r)r.outerHTML=rowHtml(BYKEY[k])}toast(isL(k)?'Öğrenildi olarak işaretlendi':'İşaret kaldırıldı');return}
  if(ds.miss){const k=ds.miss;grade(k,0);const it=document.getElementById('it-'+k);if(it&&!t.closest('#inl')){it.outerHTML=rowHtml(BYKEY[k]);const n=document.getElementById('it-'+k);n.insertAdjacentHTML('beforeend',detail(BYKEY[k],false));n.querySelector('.row').setAttribute('aria-expanded','true')}else{openSheet(detail(BYKEY[k],true));const r=document.getElementById('it-'+k);if(r)r.outerHTML=rowHtml(BYKEY[k])}renderMeters();toast('Bugün yeniden sorulacak');return}
  if(ds.unlock!==undefined){unlockSheet();return}
  if(ds.say){speak(TK[+ds.say].en);return}
  if(ds.deck){deckCat=ds.deck;render();return}
  if(ds.newn){newN=ds.newn==='auto'?null:+ds.newn;render();return}
  if(ds.front){front=ds.front;render();return}
  if(ds.start!==undefined){startStudy();return}
  if(ds.g){answer(+ds.g);return}
  if(ds.sw){const o=Q[qi];sweep(o.key,ds.sw==='1');done++;qi++;shown=false;if(qi>=Q.length&&ALL.some(x=>!S.c[x.key]?.s&&(deckCat==='rec'||x.pos===deckCat))){drawStudy();$('sfoot').innerHTML='<button class="btn fill reveal" data-sweep>50 kelime daha tara</button><button class="btn" data-endstudy>Bitir</button>';return}drawStudy();return}
  if(ds.sweep!==undefined){startSweep();return}
  if(ds.exam!==undefined){return}
  if(ds.endstudy!==undefined){closeStudy();return}
  if(ds.backup!==undefined){backup();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('inl'))closeSheet();else if(studying)closeStudy()}
  if(studying&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(smode==='tara'){if(e.key==='ArrowLeft'){const b=document.querySelector('[data-sw="0"]');if(b)b.click()}else if(e.key==='ArrowRight'){const b=document.querySelector('[data-sw="1"]');if(b)b.click()}}else if(e.key===' '&&!shown){e.preventDefault();shown=true;drawStudy()}else if(shown&&'123'.includes(e.key))answer(+e.key-1)}});
$('q').addEventListener('input',()=>{limit=60;render()});
$('qx').onclick=()=>{$('q').value='';render();$('q').focus()};
loadLocal();if(!S.exam){S.exam=today()+30;saveLocal()}updateBadge();render();
if(LOCKED)unlockSaved();
initSync();

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
